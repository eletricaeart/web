<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Paged | Elétrica & Art</title>
    <link rel="stylesheet" href="../assets/css/globals.css" />
    <script cjs src="../assets/js/cjs.js"></script>
    <script src="../assets/js/helpers.js"></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/components/widgets.js" defer></script>
    <script src="../assets/components/BackButton.js" defer></script>
    <script src="../assets/components/Text.js" defer></script>
    <script src="../assets/components/AppBar.js" defer></script>
    <script src="../assets/components/FAB2.js" defer></script>
    <style>
      html {
        background: #f0f2f5;
      }
      body {
        background: #f0f2f5;
        font-family: "Poppins", sans-serif;
      }
      main.page {
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
        padding-bottom: 100px;
      }
      main.page > ui {
        padding: 1rem;
      }
      .dash {
        position: sticky;
        top: 72px;
        z-index: 10;
        background: #f0f2f5;
        padding: 1rem;
      }
      .header-dash {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.8rem;
      }
      .orcamento-card {
        background: white;
        padding: 20px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: 0.3s;
        border-radius: 13px;
        border-left: 6px solid #ffcc00;
      }
      .orcamento-card:nth-child(even) {
        border-left-color: #27f;
      }
      .info h3 {
        margin: 0;
        color: #333;
        font-size: 1.1rem;
      }
      .info p {
        margin: 5px 0 0;
        color: #777;
        font-size: 0.85em;
      }
      .loading {
        text-align: center;
        padding: 50px;
        color: #777;
      }
      .status-label {
        font-size: 0.7em;
        font-weight: bold;
        color: #ffab00;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="loading_overlay" style="display: none">
      <div class="spinner"></div>
      <t>Sincronizando orçamentos...</t>
    </div>
    <main class="page">
      <header class="dash">
        <div class="header-dash" id="dash_title"></div>
        <div class="search-container" style="margin-bottom: 1.5rem">
          <input
            type="text"
            id="searchInput"
            placeholder="🔍 Buscar cliente ou serviço..."
            style="
              height: 50px;
              border-radius: 12px;
              border: 1px solid #ddd;
              padding: 0 15px;
              width: 100%;
            "
          />
        </div>
      </header>
      <ui>
        <div id="list_container">
          <div class="loading">Carregando dados...</div>
        </div>
      </ui>
    </main>

    <script>
      const API_URL = env.endpoints.budgets;
      const CACHE_KEY = "ea_orcamentos_cache";
      const PENDING_KEY = "ea_pending_budget";
      let allOrcamentos = [];

      function renderList(orcamentos) {
        const container = document.getElementById("list_container");
        container.innerHTML = orcamentos.length
          ? ""
          : "<p>Nenhum resultado encontrado.</p>";

        [...orcamentos].reverse().forEach((orc) => {
          const isTemp = String(orc.id).startsWith("TEMP_");
          const dataEmissao = getCleanDate(orc.docTitle.emissao);
          const card = document.createElement("div");
          card.className = "orcamento-card";
          if (isTemp) card.style.opacity = "0.5";

          card.innerHTML = `
            <div class="info" onclick="window.location.href='budget.html?id=${orc.id}'" style="cursor:pointer; flex:1;">
                <small style="color:#999">${dataEmissao} ${isTemp ? '<span class="status-label">(Enviando...)</span>' : ""}</small>
                <h3>${orc.cliente.name || "Sem Nome"}</h3>
                <p>${orc.docTitle.text || "Sem Título"}</p>
            </div>
            <div class="actions" style="display:flex; gap:10px;">
                ${
                  isTemp
                    ? "<span>⏳</span>"
                    : `
                    <span onclick="duplicateOrcamento('${orc.id}')" style="cursor:pointer" title="Duplicar">📋</span>
                    <span onclick="editOrcamento('${orc.id}')" style="cursor:pointer" title="Editar">✏️</span>
                    <span onclick="deleteOrcamento('${orc.id}')" style="color:red; cursor:pointer" title="Excluir">🗑️</span>
                `
                }
            </div>
          `;
          container.appendChild(card);
        });
      }

      async function deleteOrcamento(id) {
        if (!confirm("Tem certeza que deseja excluir este orçamento?")) return;
        id = String(id).trim();

        // UI Otimista
        allOrcamentos = allOrcamentos.filter((orc) => orc.id != id);
        renderList(allOrcamentos);
        localStorage.setItem(CACHE_KEY, JSON.stringify(allOrcamentos));

        try {
          await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({ action: "delete", id: id }),
          });
        } catch (err) {
          alert("Erro ao excluir. Tente sincronizar.");
          loadData(true);
        }
      }

      function editOrcamento(id) {
        const orc = allOrcamentos.find((x) => x.id == id);
        localStorage.setItem("edit_budget_data", JSON.stringify(orc));
        window.location.href = "captura.html?edit=true";
      }

      async function duplicateOrcamento(id) {
        const orc = allOrcamentos.find((x) => x.id == id);
        const duplicated = { ...orc, action: "create", id: "EA-" + Date.now() };
        document.getElementById("loading_overlay").style.display = "flex";
        try {
          await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify(duplicated),
          });
          loadData(true);
        } catch (e) {
          alert("Erro ao duplicar");
        } finally {
          document.getElementById("loading_overlay").style.display = "none";
        }
      }

      async function loadData(forceRefresh = false) {
        const cachedData = localStorage.getItem(CACHE_KEY);
        if (cachedData) {
          allOrcamentos = JSON.parse(cachedData);
          renderList(allOrcamentos);
        }
        checkAndSyncPending();
        if (forceRefresh || !cachedData) await fetchAndCache();
      }

      async function checkAndSyncPending() {
        const pending = localStorage.getItem(PENDING_KEY);
        if (!pending) return;
        try {
          const payload = JSON.parse(pending);
          await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify(payload),
          });
          localStorage.removeItem(PENDING_KEY);
          setTimeout(() => fetchAndCache(true), 1500);
        } catch (e) {
          console.error("Erro na sincronia.");
        }
      }

      async function fetchAndCache(isSilent = false) {
        const overlay = document.getElementById("loading_overlay");
        if (!isSilent) overlay.style.display = "flex";
        try {
          const response = await fetch(`${API_URL}?t=${new Date().getTime()}`);
          allOrcamentos = await response.json();
          localStorage.setItem(CACHE_KEY, JSON.stringify(allOrcamentos));
          renderList(allOrcamentos);
        } catch (error) {
          console.error("Erro ao buscar dados.");
        } finally {
          overlay.style.display = "none";
        }
      }

      document.getElementById("searchInput").on("input", (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allOrcamentos.filter(
          (orc) =>
            orc.cliente.name.toLowerCase().includes(term) ||
            orc.docTitle.text.toLowerCase().includes(term),
        );
        renderList(filtered);
      });

      window.addEventListener("load", () => {
        dash_title.innerHTML = tt({ tag: "h1", text: "Orçamentos Paged" });
        loadData();
        createFAB([
          { icon: "✍️", label: "Novo Orçamento", action: `captura.html` },
          { icon: "🔄", label: "Sincronizar", action: () => loadData(true) },
        ]);
      });
    </script>
  </body>
</html>
