<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Cliente | Elétrica & Art</title>
    <link rel="stylesheet" href="../assets/css/globals.css" />
    <script cjs src="../assets/js/cjs.js"></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/js/helpers.js"></script>
    <script src="../assets/components/BackButton.js" defer></script>
    <script src="../assets/components/ea/Text.js" defer></script>
    <script src="../assets/components/ea/PageHeader.js" defer></script>
    <script src="../assets/components/AppBar.js" defer></script>
    <script src="../assets/components/ea/EAModal.js" defer></script>
    <style>
      body {
        background: #f0f2f5;
        font-family: "Poppins", sans-serif;
      }
      .avatar-section {
        text-align: center;
        padding: 2rem;
        background: var(--sv-sodalita);
        color: white;
      }
      .avatar-circle {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 4px solid white;
        margin: 0 auto 10px;
        overflow: hidden;
        background: #eee;
        cursor: pointer;
        position: relative;
      }
      .avatar-circle img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .avatar-overlay {
        position: absolute;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        width: 100%;
        font-size: 10px;
        padding: 2px 0;
      }

      .form-container {
        max-width: 850px;
        margin: -30px auto 100px;
        padding: 0 1rem 150px;
      }
      card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        margin-bottom: 1.5rem;
        overflow: hidden;
        display: block;
      }
      .card-header {
        background: #f8f9fa;
        padding: 10px 20px;
        border-bottom: 1px solid #eee;
        font-weight: bold;
        color: var(--sv-sombra-azul);
      }
      .card-body {
        padding: 20px;
      }

      .input-group {
        margin-bottom: 15px;
      }
      .input-group label {
        display: block;
        font-size: 0.8rem;
        color: #777;
        margin-bottom: 5px;
        font-weight: 600;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-family: inherit;
        font-size: 0.95rem;
      }

      footer.footer-btn {
        display: grid;
        place-items: center;
        padding: 1rem;
        gap: 1rem;
        position: fixed;
        bottom: 0;
        width: 100%;
        background: #f5f5f5;
      }
      .btn-save {
        background: #e8f1ff;
        width: 100%;
        height: 56px;
        font-weight: bold;
        font-size: 1.1rem;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        /*position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);*/
        max-width: 820px;
        z-index: 100;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        box-shadow: 0 0 0 5px #27f3;
      }
      .gender-select {
        display: flex;
        gap: 10px;
      }
      .gender-btn {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
        text-align: center;
        cursor: pointer;
      }
      .gender-btn.active {
        background: var(--sv-sombra-azul);
        color: white;
        border-color: var(--sv-sombra-azul);
      }
    </style>
    <style divider>
      divider {
        position: relative;
      }
      divider::before {
        border-bottom: 2px dashed #9995;
        content: " ";
        width: 90%;
        left: 5%;
        position: absolute;
      }
    </style>
  </head>
  <body>
    <div class="avatar-section">
      <div
        class="avatar-circle"
        onclick="document.getElementById('fileInput').click()"
      >
        <img
          id="view_avatar"
          src="../assets/imgs/avatar/default_avatar_masc.webp"
          alt="Avatar"
        />
        <div class="avatar-overlay">ALTERAR FOTO</div>
      </div>
      <input
        type="file"
        id="fileInput"
        style="display: none"
        accept="image/*"
      />
      <h2 id="view_name">Novo Cliente</h2>
    </div>

    <div class="form-container">
      <input type="hidden" id="c_id" />

      <card>
        <div class="card-header">DADOS BÁSICOS</div>
        <div class="card-body">
          <div class="input-group">
            <label>NOME COMPLETO / EMPRESA *</label>
            <input
              type="text"
              id="c_name"
              placeholder="Ex: Silvio Junior"
              required
            />
          </div>
          <div
            class="grid-row"
            style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px"
          >
            <div class="input-group">
              <label>GÊNERO</label>
              <select id="c_gender" onchange="updateDefaultAvatar()">
                <option value="masc">Masculino</option>
                <option value="fem">Feminino</option>
              </select>
            </div>
            <div class="input-group">
              <label>CPF / CNPJ</label>
              <input type="text" id="c_doc" placeholder="000.000.000-00" />
            </div>
          </div>
        </div>
      </card>

      <card>
        <div class="card-header">CONTATO</div>
        <div class="card-body">
          <div
            class="grid-row"
            style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px"
          >
            <div class="input-group">
              <label>WHATSAPP</label>
              <input type="tel" id="c_whatsapp" placeholder="(13) 99999-9999" />
            </div>
            <div class="input-group">
              <label>EMAIL</label>
              <input
                type="email"
                id="c_email"
                placeholder="cliente@email.com"
              />
            </div>
          </div>
        </div>
      </card>

      <card>
        <div class="card-header">ENDEREÇO</div>
        <div class="card-body">
          <div class="input-group">
            <label>CEP</label>
            <input type="text" id="c_cep" maxlength="9" />
          </div>
          <div class="input-group">
            <label>RUA / LOGRADOURO</label>
            <input type="text" id="c_rua" />
          </div>
          <div
            class="grid-row"
            style="display: grid; grid-template-columns: 1fr 2fr; gap: 15px"
          >
            <div class="input-group">
              <label>NÚMERO</label>
              <input type="text" id="c_num" />
            </div>
            <div class="input-group">
              <label>BAIRRO</label>
              <input type="text" id="c_bairro" />
            </div>
          </div>
          <div class="input-group">
            <label>CIDADE - UF</label>
            <input type="text" id="c_cidade" />
          </div>
        </div>
      </card>

      <budgets section id="section_history" style="display: none">
        <divider section>
          <content>
            <t6 title>HISTÓRICO DE ORÇAMENTOS</t6>
          </content>
        </divider>

        <content id="history_list"> </content>
      </budgets>

      <notes section id="section_notes" style="display: none; margin-top: 2rem">
        <divider section>
          <content>
            <t6 title>NOTAS TÉCNICAS DA OBRA</t6>
          </content>
        </divider>

        <content id="notes_history_list"> </content>
      </notes>
    </div>
    <footer class="footer-btn">
      <style></style>
      <button class="btn-save" onclick="saveClient()">SALVAR</button>
      <button
        id="btn_delete"
        class="btn-save"
        style="background: #ff4444; color: white; bottom: 90px; display: none"
        onclick="deleteClient()"
      >
        EXCLUIR
      </button>
    </footer>

    <script>
      window.ea_config = {
        // title: "Novo Cliente",
      };

      const AVATARS = {
        masc: "../assets/imgs/avatar/default_avatar_masc.webp",
        fem: "../assets/imgs/avatar/default_avatar_fem.webp",
      };

      window.addEventListener("load", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get("id");

        if (editId) {
          const clients = JSON.parse(
            localStorage.getItem("ea_clients_cache") || "[]",
          );
          const clientObj = clients.find((c) => c.id === editId);

          if (clientObj) {
            fillForm(clientObj);

            // carrega os orçamentos vinculados ao cliente.
            loadCustomerHistory(clientObj.name);

            // carrega as notas Técnicas vinculadas ao cliente.
            loadCustomerNotes(clientObj.name);

            // Se há ID, mostramos o botão de deletar
            const btnDel = document.getElementById("btn_delete");
            if (btnDel) btnDel.style.display = "block";
          }
        }
      });

      //
      function loadCustomerHistory(clientName) {
        const budgetsCache = JSON.parse(
          localStorage.getItem("ea_orcamentos_cache") || "[]",
        );

        // Filtra orçamentos onde o nome do cliente bate (ou ID se você já estiver salvando)
        const history = budgetsCache.filter(
          (o) => o.cliente.name === clientName,
        );

        const section = document.getElementById("section_history");
        const container = document.getElementById("history_list");

        if (history.length > 0) {
          section.style.display = "block";
          container.innerHTML = history
            .map(
              (o) => `
            <card style="margin-bottom: 10px; cursor: pointer;" onclick="window.location.href='orcamento.html?id=${o.id}'">
              <card-content style="padding: 15px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <strong style="display: block; color: var(--sv-sombra-azul);">${o.docTitle.text || "Orçamento sem título"}</strong>
                  <small style="color: #777;">Emissão: ${getCleanDate(o.docTitle.emissao)}</small>
                </div>
                <div style="color: var(--sv-sombra-azul); font-weight: bold;"> > </div>
              </card-content>
            </card>
          `,
            )
            .join("");
        }
      }

      // Lógica JavaScript para Carregar as Notas
      function loadCustomerNotes(clientName) {
        // Puxa do cache que o EASync mantém atualizado
        const notesCache = JSON.parse(
          localStorage.getItem("ea_notes_cache") || "[]",
        );

        // Filtra as notas vinculadas a este cliente
        const customerNotes = notesCache.filter(
          (n) => n.clienteNome === clientName,
        );

        const section = document.getElementById("section_notes");
        const container = document.getElementById("notes_history_list");

        if (customerNotes.length > 0) {
          section.style.display = "block";
          container.innerHTML = customerNotes
            .map(
              (n) => `
      <card style="margin-bottom: 10px; border-left: 5px solid var(--sv-sodalita); cursor: pointer;" 
            onclick="window.location.href='new-note.html?id=${n.id}'">
        <card-content style="padding: 15px;">
          <div style="display: flex; justify-content: space-between; align-items: start; padding: 0 .7rem;">
            <strong style="color: var(--sv-sombra-azul); font-size: 0.9rem;">${n.title}</strong>
            <small style="color: #999; font-size: 0.7rem;">${getCleanDate(n.data)}</small>
          </div>
          <p style="margin: 5px 0 0; font-size: 0.8rem; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 .7rem;">
            ${n.content.split("\n")[0]}
          </p>
        </card-content>
      </card>
    `,
            )
            .join("");
        }
      }

      // função para gerenciar a exclusão com confirmação de segurança.
      async function deleteClient() {
        const id = document.getElementById("c_id").value;
        const name = document.getElementById("c_name").value;

        if (!id) return;

        // Calcula a quantidade de orçamentos vinculados para o aviso
        const budgetsCache = JSON.parse(
          localStorage.getItem("ea_orcamentos_cache") || "[]",
        );
        const totalVinculados = budgetsCache.filter(
          (o) => o.cliente.name === name,
        ).length;

        const confirmou = await EAModal.confirm(
          "Excluir Cliente",
          `O cliente <b>${name}</b> possui <b>${totalVinculados}</b> orçamentos vinculados. <br><br> Deseja mesmo excluí-lo permanentemente?`,
          "danger",
        );
        if (!confirmou) return;

        const btn = document.getElementById("btn_delete");
        btn.innerText = "EXCLUINDO...";
        btn.disabled = true;

        try {
          // 1. Remove do Google Sheets
          await fetch(env.endpoints.clients, {
            method: "POST",
            mode: "no-cors", // Mantendo seu padrão de comunicação
            body: JSON.stringify({ action: "delete", id: id }),
          });

          // 2. Remove do Cache Local
          let cache = JSON.parse(
            localStorage.getItem("ea_clients_cache") || "[]",
          );
          cache = cache.filter((c) => c.id !== id);
          localStorage.setItem("ea_clients_cache", JSON.stringify(cache));

          alert("Cliente excluído com sucesso!");
          window.location.href = "clientes-lista.html";
        } catch (e) {
          alert("Erro ao excluir cliente no servidor.");
          btn.innerText = "EXCLUIR CLIENTE";
          btn.disabled = false;
        }
      }

      // Busca automática de CEP para o novo cliente
      document.getElementById("c_cep").addEventListener("blur", async (e) => {
        let cep = e.target.value.replace(/\D/g, "");
        if (cep.length === 8) {
          try {
            const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
            const d = await res.json();
            if (!d.erro) {
              document.getElementById("c_rua").value = d.logradouro;
              document.getElementById("c_bairro").value = d.bairro;
              document.getElementById("c_cidade").value =
                `${d.localidade} - ${d.uf}`;
              document.getElementById("c_num").focus();
            }
          } catch (err) {
            console.error("Erro ao buscar CEP", err);
          }
        }
      });

      function updateDefaultAvatar() {
        const gender = document.getElementById("c_gender").value;
        document.getElementById("view_avatar").src = AVATARS[gender];
      }

      function fillForm(c) {
        document.getElementById("c_id").value = c.id;
        document.getElementById("c_name").value = c.name;
        document.getElementById("c_gender").value = c.gender || "masc";
        document.getElementById("c_doc").value = c.doc || "";
        document.getElementById("c_whatsapp").value = c.whatsapp || "";
        document.getElementById("c_email").value = c.email || "";
        document.getElementById("c_cep").value = c.cep || "";
        document.getElementById("c_rua").value = c.rua || "";
        document.getElementById("c_num").value = c.num || "";
        document.getElementById("c_bairro").value = c.bairro || "";
        document.getElementById("c_cidade").value = c.cidade || "";
        updateDefaultAvatar();
        document.getElementById("view_name").innerText = c.name;
      }

      async function saveClient() {
        const name = document.getElementById("c_name").value.trim();
        const doc = document.getElementById("c_doc").value.trim();
        const editId = document.getElementById("c_id").value;

        if (!name) return alert("O nome do cliente é obrigatório!");

        // Validação de Duplicidade (Opcional, mas profissional)
        let cache = JSON.parse(
          localStorage.getItem("ea_clients_cache") || "[]",
        );
        if (!editId && doc !== "" && cache.some((c) => c.doc === doc)) {
          if (
            !confirm(
              "Já existe um cliente com este CPF/CNPJ. Deseja continuar?",
            )
          )
            return;
        }

        const clientData = {
          id: editId || crypto.randomUUID(), // UUID Profissional
          name: name,
          gender: document.getElementById("c_gender").value,
          doc: doc,
          whatsapp: document.getElementById("c_whatsapp").value,
          email: document.getElementById("c_email").value,
          cep: document.getElementById("c_cep").value,
          rua: document.getElementById("c_rua").value,
          num: document.getElementById("c_num").value,
          bairro: document.getElementById("c_bairro").value,
          cidade: document.getElementById("c_cidade").value,
          updatedAt: new Date().toISOString(),
        };

        const btn = document.querySelector(".btn-save");
        btn.innerText = "SALVANDO...";
        btn.disabled = true;

        try {
          // Envio para o Google Sheets (Ajuste o endpoint no seu env.js se necessário)
          await fetch(env.endpoints.clients, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({ action: "save_client", ...clientData }),
          });

          // Atualiza cache local de clientes
          const index = cache.findIndex((c) => c.id === clientData.id);
          if (index > -1) cache[index] = clientData;
          else cache.push(clientData);
          localStorage.setItem("ea_clients_cache", JSON.stringify(cache));

          // Lógica de Fluxo: Se veio do rascunho de orçamento, volta para lá
          if (localStorage.getItem("ea_draft_budget")) {
            localStorage.setItem(
              "ea_selected_client",
              JSON.stringify(clientData),
            );
            window.location.href = "captura.html?restore=true";
          } else {
            window.location.href = "dashboard.html";
          }
        } catch (e) {
          // aler/t("Erro ao salvar cliente.");
          EAModal.alert(
            "Ops!",
            "Houve um erro ao salvar o cliente no servidor.",
          );
          btn.innerText = "SALVAR CLIENTE";
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
