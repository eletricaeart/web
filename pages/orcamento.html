<!doctype html>
<html lang="pt-br">
  <head>
    <title>Gerador de Orçamento | Elétrica & Art</title>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/globals.css" />

    <!-- Substituído html2pdf por Paged.js -->
    <!-- <script -->
    <!--   src="https://unpkg.com/pagedjs/dist/paged.polyfill.js" -->
    <!--   data-pagedjs-autostart="false" -->

    <script cjs src="../assets/js/cjs.js"></script>
    <script src="../assets/js/globals.js" defer></script>
    <script widgets src="../assets/components/widgets.js" defer></script>
    <script EACard src="../assets/components/EACard.js" defer></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/components/BackButton.js" defer></script>
    <script src="../assets/components/Text.js" defer></script>
    <script src="../assets/components/AppBar.js" defer></script>
    <script src="../assets/components/FAB2.js" defer></script>

    <style>
      /* Configurações Paged.js */
      @page {
        size: A4;
        /* margin: 0mm; */
        margin: 5mm 0 5mm 0;
        @bottom-right {
          content: "Pág. " counter(page) " de " counter(pages);
          font-size: 9pt;
        }
      }

      /* Evita quebra no meio de elementos importantes */
      .clause,
      .subclause,
      .clause-header,
      .subclause-header,
      /*article,
      section*/ {
        break-inside: avoid;
      }

      article {
        break-before: auto;
      }

      .clause-header,
      .subclause-header,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        break-after: avoid;
      }

      .clause-header {
        break-inside: avoid;
      }

      .subclause-body {
        break-inside: auto;
      }

      /* Força quebra de página onde houver a tag brk */
      brk {
        break-before: page;
        display: block;
        height: 0;
      }

      h1,
      h2,
      h3,
      h4,
      h5 {
        break-after: avoid;
      }

      /* Esconde elementos da interface na impressão */
      @media print {
        #btn_createPDF,
        footer,
        .fab-container,
        #loading_overlay,
        .no-print {
          display: none !important;
        }

        body {
          /* Chrome, Safari, Edge */
          -webkit-print-color-adjust: exact !important;
          /* Firefox e padrão W3C */
          print-color-adjust: exact !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading_overlay">
      <div class="spinner"></div>
      <t>Gerando seu orçamento...</t>
    </div>

    <home-page>
      <view id="invoice_html">
        <ea-card section="dual"></ea-card>
        <doc-title id="docTitle"></doc-title>
        <cliente id="cliente"></cliente>
        <div id="dynamicContent"></div>
        <!-- Container para cláusulas -->
        <footer id="pageFooter"></footer>
      </view>
    </home-page>

    <footer>
      <content>
        <label>
          <input
            type="button"
            id="btn_createPDF"
            value="Imprimir / Salvar PDF"
          />
        </label>
      </content>
    </footer>

    <script>
      function render(data) {
        const dynamicContainer = document.getElementById("dynamicContent");

        // 1. Renderização do doc-title
        const docTitleEl = document.getElementById("docTitle");
        if (docTitleEl) {
          const dataEmissaoLimpa = data.docTitle.emissao.includes("T")
            ? data.docTitle.emissao.split("T")[0].split("-").reverse().join("/")
            : data.docTitle.emissao;

          docTitleEl.innerHTML = `
            ${data.docTitle.subtitle ? `<t style='font-weight: 700; color: var(--sv-azul-bebe)'>${data.docTitle.subtitle}</t>` : ""}
            <t style='font-weight: 700; color: #003b6b'>${data.docTitle.text}</t>
            <t id="doc_id" style="background: #fff; width: 100%; padding: .2em; margin: .2em 0 0; display: flex; align-items: center; justify-content: end; gap: 1em; font-size: .8em;">
              <b>Data de Emissão: </b><t>${dataEmissaoLimpa}</t>
              <t style="font-weight: 700; padding: 0 .5em;"> | </t>
              <b>Validade da Proposta: </b><t>${data.docTitle.validade}</t>
            </t>
          `;
        }

        // 2. Dados do Cliente
        const clienteEl = document.getElementById("cliente");
        const fullAddress = `${data.cliente.rua}${data.cliente.num ? ", " + data.cliente.num : ""}${data.cliente.bairro ? ", " + data.cliente.bairro : ""} — ${data.cliente.cidade}${data.cliente.cep ? ", " + data.cliente.cep : ""}`;
        if (clienteEl) {
          clienteEl.innerHTML = `
            <ui><header><ui><t style="font-weight: 700; color: var( --sv-azul-bebe );">CLIENTE</t></ui></header>
            <content><card><ui><t><b>Nome: </b> ${data.cliente.name || "Não fornecido"}</t>
            <t><b>Endereço: </b>${fullAddress}</t></ui></card></content></ui>`;
        }

        // 3. Cláusulas Dinâmicas
        let dynamicHTML = "";
        data.servicos.forEach((servico, index) => {
          dynamicHTML += `<article class="clause"><ui><header class="clause-header"><ui>
            <t style="font-weight: 700; text-transform: uppercase;">${index + 1}. ${servico.titulo}</t>
            </ui></header><content>`;

          servico.itens.forEach((item) => {
            dynamicHTML += `<section class="subclause"><ui><header class="subclause-header"><t6>${item.subtitulo || ""}</t6></header>
              <content class="subclause-body">`;

            item.detalhes.forEach((det) => {
              if (det.tipo === "brk") dynamicHTML += `<brk></brk>`;
              else if (det.tipo === "ul" || det.tipo === "ol") {
                dynamicHTML += `<${det.tipo}>${det.conteudo.map((txt) => `<li>${txt}</li>`).join("")}</${det.tipo}>`;
              } else
                dynamicHTML += `<${det.tipo}>${det.conteudo}</${det.tipo}>`;
            });
            dynamicHTML += `</content></ui></section>`;
          });
          dynamicHTML += `</content></ui></article>`;
        });

        dynamicHTML += envtags.endingTag;
        dynamicContainer.innerHTML = dynamicHTML;
        document.title = `Orçamento_${data.cliente.name}`;
      }

      // Função de Impressão (Paged.js lida com a renderização automaticamente ao chamar print)
      document.getElementById("btn_createPDF").addEventListener("click", () => {
        window.print();
      });

      (async function init() {
        const overlay = document.getElementById("loading_overlay");
        const urlParams = new URLSearchParams(window.location.search);
        const orcamentoId = urlParams.get("id");

        try {
          const response = await fetch(
            `${env.endpoints.budgets}?id=${orcamentoId}`,
          );
          const data = await response.json();
          window.data = data;
          render(data);
          overlay.style.opacity = "0";
          setTimeout(() => overlay.remove(), 500);
        } catch (error) {
          console.error("Erro:", error);
          overlay.innerHTML =
            "<t style='color:red'>Erro ao carregar dados!</t>";
        }
      })();

      window.addEventListener("load", () => {
        createFAB([
          {
            icon: "✏️",
            label: "Editar Orçamento",
            action: () => {
              localStorage.setItem(
                "edit_budget_data",
                JSON.stringify(window.data),
              );
              window.location.href = "captura.html?edit=true";
            },
          },
          {
            icon: "📋",
            label: "PDF",
            /*action: async () => {
              const payload = { ...window.data, action: "create" };
              await fetch(env.endpoints.budgets, {
                method: "POST",
                body: JSON.stringify(payload),
              });
              window.location.href = "dashboard.html";
            },*/
            action: () => window.print(),
          },
          /*{
            icon: "@",
            label: "print",
            action: () => {
              document
                .getElementById("btn_createPDF")
                .addEventListener("click", async () => {
                  const paged = new Paged.Polyfill();

                  await paged.preview(document.getElementById("invoice_html"));

                  window.print();
                });
            },
          },*/
        ]);
      });
    </script>
  </body>
</html>
