<!doctype html>
<html lang="pt-br">
  <head>
    <title>Gerador de Orçamento | Elétrica & Art</title>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/globals.css" />

    <script src="../assets/js/html2pdf-0.9.2.js"></script>
    <script cjs src="../assets/js/cjs.js"></script>
    <script src="../assets/js/globals.js" defer></script>
    <script widgets src="../assets/components/widgets.js" defer></script>
    <script EACard src="../assets/components/EACard.js" defer></script>
    <script DownloadPDF src="../assets/js/DownloadPDF.js" defer></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/components/BackButton.js" defer></script>
    <script src="../assets/components/Text.js" defer></script>
    <script src="../assets/components/AppBar.js" defer></script>
    <script src="../assets/components/FAB2.js" defer></script>
    <style>
    /* Evita quebra no meio de elementos importantes */
.clause,
.subclause,
.clause-header,
.subclause-header,
article,
section {
  page-break-inside: avoid;
  break-inside: avoid;
}

/* Títulos nunca quebram */
h1, h2, h3, h4, h5 {
  page-break-after: avoid;
  break-after: avoid;
}

/* Barras coloridas / headers */
.clause-header,
.subclause-header {
  page-break-inside: avoid;
  break-inside: avoid;
}
    </style>
  </head>
  <body>
    <div id="loading_overlay">
      <div class="spinner"></div>
      <t>Gerando seu orçamento...</t>
    </div>
    <home-page>
      <view id="invoice_html">
        <ea-card section="dual"></ea-card>

        <doc-title id="docTitle"></doc-title>
        <cliente id="cliente"></cliente>

        <footer id="pageFooter"></footer>
      </view>
    </home-page>

    <footer>
      <content>
        <label>
          <input type="button" id="btn_createPDF" value="Baixar em pdf" />
        </label>
      </content>
    </footer>

    <script>
      function render(data) {
        const footer = document.getElementById("pageFooter");

        // 1. Renderização do doc-title (Seguindo fielmente o widget original)
        const docTitleEl = document.getElementById("docTitle");
        if (docTitleEl) {
          const dataEmissaoLimpa = data.docTitle.emissao.includes("T")
            ? data.docTitle.emissao.split("T")[0].split("-").reverse().join("/")
            : data.docTitle.emissao;

          const subtitleHtml = data.docTitle.subtitle
            ? `
            <t style='font-weight: 700; color: var(--sv-azul-bebe)'>
              ${data.docTitle.subtitle}
            </t>
          `
            : "";

          docTitleEl.innerHTML = `
            ${subtitleHtml}
            <t style='font-weight: 700; color: #003b6b'>
              ${data.docTitle.text}
            </t>
            <t id="doc_id" style="background: #fff; width: 100%; padding: .2em; margin: .2em 0 0; display: flex; align-items: center; justify-content: end; gap: 1em; font-size: .8em;">
              <b>Data de Emissão: </b>
              <t>${dataEmissaoLimpa}</t>
              <t style="font-weight: 700; padding: 0 .5em;"> | </t>
              <b>Validade da Proposta: </b>
              <t>${data.docTitle.validade}</t>
            </t>
          `;
        }

        // 2. Atualiza Dados do Cliente (Apenas atributos, pois o globals.js/widgets.js cuida do resto)
        const clienteEl = document.getElementById("cliente");
        const fullAddress = `${data.cliente.rua}${data.cliente.num ? ", " + data.cliente.num : ""}${data.cliente.bairro ? ", " + data.cliente.bairro : ""} — ${data.cliente.cidade}${data.cliente.cep ? ", " + data.cliente.cep : ""}`;
        if (clienteEl) {
          clienteEl.innerHTML = `
            <ui>
              <header><ui>
                <t style="font-weight: 700; color: var( --sv-azul-bebe );">CLIENTE</t>
              </ui></header>
              <content>
                <card>
                  <ui>                
                    <t style="font-weight: 700; text-transform: uppercase;">
                      <b>Nome: </b> ${data.cliente.name || "Não fornecido"}
                    </t>
                    <t>
                      <b>Endereço: </b>${fullAddress || "Não fornecido"}
                    </t>
                  </ui>  
                </card>
              </content>
            </ui>
          `;
        }

        // 2. Monta a string de HTML das Cláusulas (Articles)
        let dynamicHTML = "";

        data.servicos.forEach((servico, index) => {
          // Usamos a estrutura que o seu widgets.js espera: <article label="...">
          dynamicHTML += `<article class="clause">
            <ui>
               <header class="clause-header">
                  <ui>
                     <t style="font-weight: 700; text-transform: uppercase;">
                      ${index + 1}. ${servico.titulo}
                     </t>
                  </ui>
               </header>
               <content>
`;

          servico.itens.forEach((item) => {
            // Se houver subtítulo, criamos a <section label="...">
            dynamicHTML += `<section class="subclause">
            <ui>
               <header class="subclause-header">
                  <t6>
                    ${item.subtitulo || ""}
                  </t6>
               </header>
               <content class="subclause-body">`;

            item.detalhes.forEach((det) => {
              if (det.tipo === "brk") {
                // Injeta a quebra de página diretamente
                dynamicHTML += `<brk></brk>`;
              } else if (det.tipo === "ul" || det.tipo === "ol") {
                dynamicHTML += `<${det.tipo}>`;
                det.conteudo.forEach((txt) => {
                  dynamicHTML += `<li>${txt}</li>`;
                });
                dynamicHTML += `</${det.tipo}>`;
              } else {
                // Suporta p, t6, tagc
                dynamicHTML += `<${det.tipo}>${det.conteudo}</${det.tipo}>`;
              }
            });

            dynamicHTML += `</content></section>`;
          });

          dynamicHTML += `</content></article>`;
        });

        // 3. Injeta o Encerramento e Assinaturas (Exatamente como nos seus componentes)
        dynamicHTML += envtags.endingTag;

        // 4. Injeção Final: Isso dispara o processamento dos seus widgets
        footer.insertAdjacentHTML("beforebegin", dynamicHTML);

        // Atualiza título da aba
        document.title = `Orçamento_${data.cliente.name}`;
      }

      (async function init() {
        const overlay = document.getElementById("loading_overlay");

        const urlParams = new URLSearchParams(window.location.search);
        const orcamentoId = urlParams.get("id");
        const API_URL = env.endpoints.budgets;

        if (!orcamentoId) return;

        try {
          const response = await fetch(`${API_URL}?id=${orcamentoId}`);
          const data = await response.json();
          window.data = data;
          render(data);

          // Esconde o loading com um leve fade
          overlay.style.transition = "opacity 0.5s";
          overlay.style.opacity = "0";
          setTimeout(() => overlay.remove(), 500);
        } catch (error) {
          console.error("Erro:", error);
          overlay.innerHTML =
            "<t style='color:red'>Erro ao carregar dados!</t>";
        }
      })();

      window.addEventListener("load", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get("id");

        createFAB([
          {
            icon: "✏️",
            label: "Editar Orçamento",
            action: () => {
              localStorage.setItem(
                "edit_budget_data",
                JSON.stringify(window.data),
              );
              window.location.href = "captura.html?edit=true";
            },
          },
          {
            icon: "📋",
            label: "Duplicar",
            action: async () => {
              document.getElementById("loading_overlay").style.display = "flex";
              const payload = { ...window.data, action: "create" };
              await fetch(env.endpoints.budgets, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify(payload),
              });
              window.location.href = "dashboard.html";
            },
          },
        ]);
      });
    </script>
  </body>
</html>
