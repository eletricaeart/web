<!doctype html>
<html lang="pt-br">
  <head>
    <title>Gerador de Orçamento | Elétrica & Art</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script widgets src="../assets/components/widgets.js" defer></script>
    <script EACard src="../assets/components/EACard.js" defer></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/components/BackButton.js" defer></script>
    <script src="../assets/components/ea/Text.js" defer></script>
    <script src="../assets/components/ea/EANotionEditor.js" defer></script>
    <script src="../assets/components/AppBar.js" defer></script>

    <style>
      /* Configurações Paged.js */
      @page {
        size: A4;
        /* margin: 0mm; */
        margin: 5mm 0 5mm 0;
        @bottom-right {
          content: "Pág. " counter(page) " de " counter(pages);
          font-size: 9pt;
        }
      }

      /* Evita quebra no meio de elementos importantes */
      .clause,
      .subclause,
      .clause-header,
      .subclause-header {
        break-inside: avoid;
      }

      article {
        break-before: auto;
      }

      .clause-header,
      .subclause-header,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        break-after: avoid;
      }

      .clause-header {
        break-inside: avoid;
      }

      .subclause-body {
        break-inside: auto;
      }

      /* Força quebra de página onde houver a tag brk */
      brk {
        break-before: page;
        display: block;
        height: 0;
      }

      h1,
      h2,
      h3,
      h4,
      h5 {
        break-after: avoid;
      }

      /* No <style> do orcamento.html para garantir o visual no PDF */
      tagc.tagc-block {
        display: block;
        padding: 10px 14px;
        background: rgba(34, 119, 255, 0.1);
        color: #0075bd;
        border-radius: 12px;
        margin: 8px 0;
        border-left: 4px solid #27f;
      }

      .subclause-body ul {
        margin: 10px 0;
        padding-left: 20px;
        list-style-type: disc; /* Garante a bolinha padrão no PDF */
      }

      .subclause-body li {
        color: #444;
        margin-bottom: 4px;
      }
      /* --- */

      /* Esconde elementos da interface na impressão */
      @media print {
        #btn_createPDF,
        footer,
        fab,
        .app-bar,
        app-bar,
        .fab-container,
        #loading_overlay,
        .no-print {
          display: none !important;
        }

        body {
          /* Chrome, Safari, Edge */
          -webkit-print-color-adjust: exact !important;
          /* Firefox e padrão W3C */
          print-color-adjust: exact !important;

          margin-left: 10x;
          margin-right: 10x;
        }
        html,
        body {
          height: auto !important;
          min-height: auto !important;
          overflow: visible !important;
          display: block !important; /* Remove flexbox que pode bugar quebras */
          background: white !important;
        }

        /* Força o container do orçamento a ocupar todo o espaço necessário */
        homepage,
        home-page,
        view#invoice_html {
          height: auto !important;
          min-height: auto !important;
          max-height: none !important;
          overflow: visible !important;
          display: block !important;
          position: static !important; /* Remove fixação ou sticky */
          /* padding: 0 !important; */
          /* margin: 0 !important; */
        }

        /* Garante que as cláusulas quebrem de página corretamente se necessário */
        article {
          break-inside: auto !important;
          page-break-inside: auto !important;
          display: block !important;
        }

        /* Ajuste para que cabeçalhos não fiquem sozinhos no fim da página */
        .clause-header,
        .subclause-header {
          break-after: avoid !important;
        }

        #footer-content {
          height: 100%;
          display: flex !important;
          flex-direction: column !important;
          min-height: 270mm !important; /* Altura aproximada de uma folha A4 menos margens */
          break-before: page !important; /* MÁGICA: Sempre começa em uma folha nova */
          page-break-before: always !important;
          margin: 0 !important;
          padding: 1cm 0 !important;
        }

        /* O topo do rodapé (texto de agradecimento) */
        #footer-content_top {
          flex: 0 !important; /* Não cresce */
        }

        /* O fundo do rodapé (assinaturas) */
        #footer-content_bottom {
          flex: 1 !important; /* CRESCE: Ocupa todo o espaço restante da folha */
          display: flex !important;
          flex-direction: column !important;
          justify-content: flex-end !important; /* Empurra o conteúdo para a base */
          height: 100%;
          margin-bottom: 2cm !important; /* Espaço de segurança no fim da folha */
        }

        #footer-content_bottom > ui {
          flex: 1;
        }

        #footer-content_bottom ui content {
          height: 100%;
          flex: 1;
        }

        /* Espaçamento interno das assinaturas */
        signatures {
          display: flex !important;
          flex-direction: row !important; /* Rafael de um lado, Cliente do outro */
          justify-content: space-between !important;
          align-items: flex-end !important;
          gap: 2cm !important;
          margin-top: 4cm !important; /* Espaço generoso para assinar */
        }

        signature {
          flex: 1 !important;
          /* border-top: 1px solid #000 !important; /* Linha da assinatura */
          padding-top: 10px !important;
        }
      }
    </style>
    <style animation-skeleton>
      #loading_overlay {
        position: fixed;
        top: 72px; /* Altura exata da sua AppBar */
        left: 0;
        width: 100%;
        height: calc(100vh - 72px);
        background: white; /* Fundo sólido para esconder o conteúdo real por baixo */
        z-index: 8000; /* Abaixo dos 9000 da sua AppBar */
        overflow-y: auto;
        /* display: flex; */
        /* flex-direction: column; */
        transition: opacity 0.4s ease;
      }

      #loading_overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* Garante que o EACard no loading não tenha margem superior excessiva */
      #loading_overlay ea-card {
        margin-top: 0;
      }
      /* Skeleton Loading Styles */
      .skeleton {
        background: #e0e0e0;
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200% 100%;
        animation: skeleton-pulse 1.5s infinite;
        border-radius: 4px;
        margin-bottom: 10px;
      }

      .sk-text {
        background: #e5e5e5;
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200% 100%;
        animation: skeleton-pulse 1.5s infinite;
        border-radius: 4px;
        display: inline-block;
        color: transparent !important; /* Esconde texto se houver */
      }

      @keyframes skeleton-pulse {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .skeleton-title {
        height: 30px;
        width: 60%;
        margin: 20px auto;
      }
      .skeleton-client {
        height: 80px;
        width: 100%;
        border-radius: 12px;
        margin-top: 15px;
      }
      .skeleton-clause {
        height: 40px;
        width: 100%;
        border-radius: 12px;
        margin-top: 25px;
      }
      .skeleton-sub {
        height: 20px;
        width: 40%;
        margin: 15px 15px 5px;
      }
      .skeleton-line {
        height: 15px;
        width: 90%;
        margin: 5px 15px;
      }

      /* Esconde o conteúdo real enquanto carrega */
      #invoice_html {
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      #invoice_html.loaded {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!--<div id="loading_overlay">
      <div class="spinner"></div>
      <t>Gerando seu orçamento...</t>
    </div>-->
    <div id="loading_overlay">
      <view
        style="padding: 1rem; width: 100%; max-width: 850px; margin: 0 auto"
      >
        <ea-card section="dual"></ea-card>

        <div style="text-align: center; margin: 20px 0">
          <div class="sk-text" style="height: 24px; width: 80%"></div>
        </div>

        <div
          style="
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
          "
        >
          <div
            style="
              color: var(--sv-azul-bebe);
              font-weight: 700;
              margin-bottom: 10px;
            "
          >
            CLIENTE
          </div>
          <div
            class="sk-text"
            style="height: 14px; width: 60%; margin-bottom: 8px"
          ></div>
          <br />
          <div class="sk-text" style="height: 14px; width: 90%"></div>
        </div>

        <article class="clause" style="margin-bottom: 20px">
          <header
            class="clause-header"
            style="background: #f5f5f5; padding: 10px; border-radius: 8px"
          >
            <div class="sk-text" style="height: 18px; width: 40%"></div>
          </header>
          <div style="padding: 15px">
            <h6 style="margin-bottom: 10px">
              <div class="sk-text" style="height: 14px; width: 30%"></div>
            </h6>
            <div
              class="sk-text"
              style="height: 12px; width: 100%; margin-bottom: 8px"
            ></div>
            <div class="sk-text" style="height: 12px; width: 85%"></div>

            <tagc class="tagc-block" style="margin-top: 15px; opacity: 0.6">
              <div class="sk-text" style="height: 12px; width: 90%"></div>
            </tagc>
          </div>
        </article>

        <article class="clause" style="opacity: 0.5">
          <header
            class="clause-header"
            style="background: #f5f5f5; padding: 10px; border-radius: 8px"
          >
            <div class="sk-text" style="height: 18px; width: 35%"></div>
          </header>
        </article>
      </view>
    </div>

    <home-page>
      <view id="invoice_html">
        <ea-card section="dual"></ea-card>
        <doc-title id="docTitle"></doc-title>
        <cliente id="cliente"></cliente>
        <div id="dynamicContent"></div>
        <!-- Container para cláusulas -->
        <footer id="pageFooter"></footer>
      </view>
    </home-page>

    <footer>
      <content>
        <label>
          <input
            type="button"
            id="btn_createPDF"
            value="Imprimir / Salvar PDF"
          />
        </label>
      </content>
    </footer>

    <script>
      function render(data) {
        const dynamicContainer = document.getElementById("dynamicContent");

        // 1. Renderização do doc-title
        const docTitleEl = document.getElementById("docTitle");
        if (docTitleEl) {
          const dataEmissaoLimpa = data.docTitle.emissao.includes("T")
            ? data.docTitle.emissao.split("T")[0].split("-").reverse().join("/")
            : data.docTitle.emissao;

          docTitleEl.innerHTML = `
            ${data.docTitle.subtitle ? `<t style='font-weight: 700; color: var(--sv-azul-bebe)'>${data.docTitle.subtitle}</t>` : ""}
            <t style='font-weight: 700; color: #003b6b'>${data.docTitle.text}</t>
            <t id="doc_id" style="background: #fff; width: 100%; padding: .2em; margin: .2em 0 0; display: flex; align-items: center; justify-content: end; gap: 1em; font-size: .8em;">
              <b>Data de Emissão: </b><t>${dataEmissaoLimpa}</t>
              <t style="font-weight: 700; padding: 0 .5em;"> | </t>
              <b>Validade da Proposta: </b><t>${data.docTitle.validade}</t>
            </t>
          `;
        }

        // 2. Dados do Cliente
        const clienteEl = document.getElementById("cliente");
        const fullAddress = `${data.cliente.rua}${data.cliente.num ? ", " + data.cliente.num : ""}${data.cliente.bairro ? ", " + data.cliente.bairro : ""} — ${data.cliente.cidade}${data.cliente.cep ? ", " + data.cliente.cep : ""}`;
        if (clienteEl) {
          clienteEl.innerHTML = `
            <ui><header><ui><t style="font-weight: 700; color: var( --sv-azul-bebe );">CLIENTE</t></ui></header>
            <content><card><ui><t><b>Nome: </b> ${data.cliente.name || "Não fornecido"}</t>
            <t><b>Endereço: </b>${fullAddress}</t></ui></card></content></ui>`;
        }

        // 3. Cláusulas Dinâmicas
        let dynamicHTML = "";
        data.servicos.forEach((servico, index) => {
          dynamicHTML += `<article class="clause"><ui><header class="clause-header"><ui>
            <t style="font-weight: 700; text-transform: uppercase;">${index + 1}. ${servico.titulo}</t>
            </ui></header><content>`;

          servico.itens.forEach((item) => {
            dynamicHTML += `<section class="subclause"><ui>
      <header class="subclause-header"><t6>${item.subtitulo || ""}</t6></header>
      <content class="subclause-body">`;

            // 1. Transformamos o array de objetos em texto bruto (Markdown)
            const textToProcess = item.detalhes
              .map((d) => {
                if (d.tipo === "brk") return "---";
                if (d.tipo === "tagc") return `> ${d.conteudo}`;
                if (d.tipo === "t6") return `# ${d.conteudo}`;
                if (d.tipo === "ul" || d.tipo === "ol") {
                  // Se for lista, juntamos os itens com quebra de linha e o prefixo "-"
                  return d.conteudo.map((li) => `- ${li}`).join("\n");
                }
                return d.conteudo; // Tipo "p"
              })
              .join("\n");

            // 2. Passamos o texto bruto pela função estática do componente
            // Isso vai gerar as tags <ul> agrupadas e os blocos <tagc> corretamente
            dynamicHTML += EANotionEditor.processText(textToProcess);

            dynamicHTML += `</content></ui></section>`;
          });
          dynamicHTML += `</content></ui></article>`;
        });

        dynamicHTML += envtags.endingTag;
        dynamicContainer.innerHTML = dynamicHTML;
        document.title = `Orçamento_${data.cliente.name}`;
      }

      // Função de Impressão (Paged.js lida com a renderização automaticamente ao chamar print)
      document.getElementById("btn_createPDF").addEventListener("click", () => {
        window.print();
      });

      (async function init() {
        const overlay = document.getElementById("loading_overlay");
        const invoice = document.getElementById("invoice_html"); // Seleciona a div do conteúdo
        const urlParams = new URLSearchParams(window.location.search);
        const orcamentoId = urlParams.get("id");

        try {
          const response = await fetch(
            `${env.endpoints.budgets}?id=${orcamentoId}`,
          );
          const data = await response.json();
          window.data = data;

          // 1. Renderiza o conteúdo real
          render(data);

          // 2. TORNA O CONTEÚDO VISÍVEL (A parte que faltava)
          if (invoice) {
            invoice.classList.add("loaded");
          }

          // 3. Transição: Tira o esqueleto e remove do DOM
          if (overlay) {
            overlay.classList.add("hidden");
            setTimeout(() => overlay.remove(), 400);
          }
        } catch (error) {
          console.error("Erro:", error);
          if (overlay) {
            overlay.innerHTML =
              "<t style='color:red; padding: 2rem; display:block; text-align:center;'>Erro ao carregar orçamento!</t>";
          }
        }
      })();

      window.addEventListener("load", () => {
        createFAB([
          {
            icon: "✏️",
            label: "Editar Orçamento",
            action: () => {
              localStorage.setItem(
                "edit_budget_data",
                JSON.stringify(window.data),
              );
              window.location.href = "captura.html?edit=true";
            },
          },
          {
            icon: "📋",
            label: "PDF",
            /*action: async () => {
              const payload = { ...window.data, action: "create" };
              await fetch(env.endpoints.budgets, {
                method: "POST",
                body: JSON.stringify(payload),
              });
              window.location.href = "dashboard.html";
            },*/
            action: () => window.print(),
          },
          /*{
            icon: "@",
            label: "print",
            action: () => {
              document
                .getElementById("btn_createPDF")
                .addEventListener("click", async () => {
                  const paged = new Paged.Polyfill();

                  await paged.preview(document.getElementById("invoice_html"));

                  window.print();
                });
            },
          },*/
        ]);
      });
    </script>
  </body>
</html>
