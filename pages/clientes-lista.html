<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes | Elétrica & Art</title>
    <link rel="stylesheet" href="../assets/css/globals.css" />
    <script cjs src="../assets/js/cjs.js"></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/components/BackButton.js" defer></script>
    <script src="../assets/components/ea/Text.js" defer></script>
    <script src="../assets/components/ea/PageHeader.js" defer></script>
    <script src="../assets/components/AppBar.js" defer></script>
    <script src="../assets/components/FAB2.js" defer></script>
    <style>
      body {
        background: #f0f2f5;
        font-family: "Poppins", sans-serif;
      }
      .search-container {
        padding: 1rem;
        position: sticky;
        top: 72px;
        background: #f0f2f5;
        z-index: 5;
      }
      #search_input {
        width: 100%;
        height: 50px;
        padding: 0 15px;
        border-radius: 25px;
        border: 1px solid #ddd;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        font-size: 1rem;
      }
      .clients-container {
        padding: 0 1rem 100px;
      }
      .client-card {
        background: white;
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 15px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        cursor: pointer;
        transition: transform 0.2s;
      }
      .client-card:active {
        transform: scale(0.98);
      }
      .client-avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        overflow: hidden;
        background: #eee;
        flex-shrink: 0;
      }
      .client-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .client-info {
        flex: 1;
      }
      .client-info h4 {
        margin: 0;
        color: var(--sv-sombra-azul);
        font-size: 1rem;
      }
      .client-info p {
        margin: 0;
        font-size: 0.8rem;
        color: #777;
      }
      .client-badge {
        background: #eef2ff;
        color: #4f46e5;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 0.7rem;
        font-weight: bold;
      }

      .empty-state {
        text-align: center;
        padding: 3rem;
        color: #999;
      }
    </style>
  </head>
  <body>
    <div class="search-container">
      <input
        type="text"
        id="search_input"
        placeholder="Buscar cliente por nome ou documento..."
        oninput="filterClients()"
      />
    </div>

    <div id="clients_list" class="clients-container"></div>

    <script>
      window.ea_config = {
        title: "Clientes",
      };

      let allClients = [];
      const AVATARS = {
        masc: "../assets/imgs/avatar/default_avatar_masc.webp",
        fem: "../assets/imgs/avatar/default_avatar_fem.webp",
      };

      window.addEventListener("load", () => {
        loadClients();

        createFAB([
          {
            icon: "👤+",
            label: "Novo Cliente",
            action: () => (window.location.href = "cliente.html"),
          },
          {
            icon: "🔄",
            label: "Sincronizar",
            action: syncClients,
          },
        ]);
      });

      function loadClients() {
        allClients = JSON.parse(
          localStorage.getItem("ea_clients_cache") || "[]",
        );
        renderClients(allClients);
      }

      function renderClients(list) {
        const container = document.getElementById("clients_list");
        if (list.length === 0) {
          container.innerHTML =
            '<div class="empty-state">Nenhum cliente encontrado.</div>';
          return;
        }

        container.innerHTML = list
          .map(
            (c) => `
          <div class="client-card" onclick="editClient('${c.id}')">
            <div class="client-avatar">
              <img src="${AVATARS[c.gender] || AVATARS.masc}" alt="Avatar">
            </div>
            <div class="client-info">
              <h4>${c.name}</h4>
              <p>${c.cidade || "Cidade não informada"}</p>
            </div>
            <div class="client-badge">${c.doc ? "DOC OK" : "S/ DOC"}</div>
          </div>
        `,
          )
          .join("");
      }

      function filterClients() {
        const term = document
          .getElementById("search_input")
          .value.toLowerCase();
        const filtered = allClients.filter(
          (c) =>
            c.name.toLowerCase().includes(term) ||
            (c.doc && c.doc.includes(term)),
        );
        renderClients(filtered);
      }

      function editClient(id) {
        window.location.href = `cliente.html?id=${id}`;
      }

      async function syncClients() {
        const fab = document.querySelector("fab");
        if (fab) fab.style.opacity = "0.5";

        try {
          const res = await fetch(env.endpoints.clients);
          const data = await res.json();
          if (Array.isArray(data)) {
            localStorage.setItem("ea_clients_cache", JSON.stringify(data));
            loadClients();
            alert("Lista de clientes atualizada!");
          }
        } catch (e) {
          alert("Erro ao sincronizar clientes.");
        } finally {
          if (fab) fab.style.opacity = "1";
        }
      }
    </script>
  </body>
</html>
