<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Nota | Elétrica & Art</title>
    <link rel="stylesheet" href="../assets/css/globals.css" />
    <script cjs src="../assets/js/cjs.js"></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/components/BackButton.js" defer></script>
    <script src="../assets/components/ea/Text.js" defer></script>
    <script src="../assets/components/AppBar.js" defer></script>
    <style>
      body {
        background: #f0f2f5;
      }
      .container {
        display: flex;
        flex-flow: column;
        gap: 0 !important;
        flex: 1;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .container > label {
        margin: 0 !important;
        padding: 0 !important;
        gap: 0 !important;
        display: flex;
      }
      label.label-title {
        box-shadow: 0 3px 3px #0002;
      }
      label.label-content {
        flex: 1;
      }
      .container > label input {
        gap: 0;
        display: flex;
        margin: 0 !important;
        background-color: transparent;
        border: 1px solid #ddd0;
      }
      textarea {
        background-color: transparent;
        width: 100%;
        min-height: 300px;
        border: 1px solid #ddd0;
        border-radius: 8px;
        padding: 15px;
        font-family: inherit;
        font-size: 1rem;
        color: #3330;
        caret-color: #ffab00;
        resize: none;
      }

      .notion-editor-container {
        position: relative;
        width: 100%;
        height: 100%;
        /* min-height: 120px; */
        /* background: #fff; */
        /* border: 1px solid #ddd; */
        /* border-radius: 0 9px 9px 9px; */
        display: grid;
      }
      .notion-preview,
      .notion-textarea {
        grid-area: 1 / 1 / 2 / 2;
        padding: 15px;
        font-family: "Poppins", sans-serif;
        font-size: 1rem;
        font-weight: 500;
        line-height: 1.6;
        width: 100%;
        height: 100%;
        min-height: 120px;
        box-sizing: border-box;
        white-space: pre-wrap;
        word-wrap: break-word;
        margin: 0;
        border: none;
        border-radius: 0 9px 9px 9px;
      }
      div#note_preview > h3 {
        font-size: inherit;
        padding: 0 !important;
        margin: 0 !important;
        padding-left: 18px !important;
        font-weight: inherit;
        font-family: inherit;
      }
      .notion-preview > li {
        font-size: inherit;
        margin: 0 !important;
        padding: 0 !important;
        padding-left: 12px !important;
        color: #777;
        /* font-weight: bold; */
        margin: 0 0 0 11px;
        font-family: "Poppins", sans-serif;
        font-weight: inherit;
        list-style: none;
        position: relative;
        padding-left: 0px;
      }
      .notion-preview li::before {
        content: "•";
        position: absolute;
        left: 0px;
        color: red;
      }
      .notion-preview tagc {
        display: block;
        padding: 0 0 0 13px;
        background: #29f2;
        color: #0075bd;
        font-weight: inherit;
        border-radius: 22px;
      }

      .btn-save {
        background: #ffcc00;
        color: #333;
        width: 100%;
        font-size: 1.1em;
        height: 55px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
      }

      footer {
        display: flex;
        flex-flow: column;
        padding: 2rem;
        background-color: #f5f5f5;
      }
    </style>
  </head>
  <body>
    <page-header>
      <style>
        page-header {
          display: flex;
          flex-flow: column;
          padding: 2rem 1.5rem;
        }
      </style>
      <ea-text
        size="1.5rem"
        shadow="var(--sv-sodalita)"
        color="#fff"
        id="page_title"
        >Nova Anotação</ea-text
      >
    </page-header>
    <div class="container">
      <input type="hidden" id="edit_id" />
      <label class="label-title">
        <input
          type="text"
          id="noteTitle"
          placeholder="Título"
          style="height: 50px; margin-bottom: 10px"
        />
      </label>

      <label class="label-content">
        <div
          class="notion-editor-container"
          style="border: none; border-radius: 0 0 12px 12px"
        >
          <div id="note_preview" class="notion-preview"></div>
          <textarea
            id="noteInput"
            class="notion-textarea"
            placeholder="Notas..."
            oninput="autoHeight(this)"
          ></textarea>
        </div>
      </label>
    </div>
    <footer>
      <button onclick="saveNote()" class="btn-save" id="btnSave">
        SALVAR ANOTAÇÃO
      </button>
    </footer>

    <script>
      function processNotionInput(text) {
        let lines = text.split("\n");
        return lines
          .map((line) => {
            if (line.startsWith("- ") || line.startsWith("* "))
              return `<li>${line.substring(2)}</li>`;
            if (line.startsWith("> "))
              return `<tagc>${line.substring(2)}</tagc>`;
            if (line.startsWith("# "))
              return `<h3 style="color:var(--sv-sombra-azul); margin:10px 0;">${line.substring(2)}</h3>`;
            if (line === "---")
              return `<hr style="border:1px dashed #ccc; margin:15px 0;">`;
            return `<div>${line || "&nbsp;"}</div>`;
          })
          .join("");
      }

      function autoHeight(el) {
        el.style.height = "auto";
        el.style.height = el.scrollHeight + "px";
        document.getElementById("note_preview").style.height = el.style.height;
      }

      // Inicializa o espelhamento
      /*window.addEventListener("load", () => {
        const tx = document.getElementById("noteInput");
        const pv = document.getElementById("note_preview");
        tx.addEventListener("input", () => {
          pv.innerHTML = processNotionInput(tx.value);
        });
      });*/
      /* --- end notion style --- */

      async function saveNote() {
        const title = document.getElementById("noteTitle").value;
        const content = document.getElementById("noteInput").value;
        const editId = document.getElementById("edit_id").value;
        if (!content) return alert("O conteúdo da nota não pode estar vazio!");

        const payload = {
          action: editId ? "update" : "save",
          id: editId,
          title: title,
          content: content,
          data: new Date().toLocaleDateString("pt-BR"),
        };

        try {
          await fetch(env.endpoints.notes, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify(payload),
          });
          // Injeta no cache para atualizar a lista sem esperar o servidor
          let cache = JSON.parse(
            localStorage.getItem("ea_notes_cache") || "[]",
          );
          if (editId) cache = cache.map((n) => (n.id == editId ? payload : n));
          else cache.push({ ...payload, id: "TEMP_" + Date.now() });
          localStorage.setItem("ea_notes_cache", JSON.stringify(cache));

          window.location.href = "notes.html";
        } catch (e) {
          alert("Erro ao salvar");
        }
      }

      window.addEventListener("load", () => {
        const tx = document.getElementById("noteInput");
        const pv = document.getElementById("note_preview");
        tx.addEventListener("input", () => {
          pv.innerHTML = processNotionInput(tx.value);
        });
        // Verifica se há dados para edição no LocalStorage
        const editData = localStorage.getItem("edit_note_data");

        if (editData) {
          const n = JSON.parse(editData);

          // Preenche os teus novos campos
          document.getElementById("noteTitle").value = n.title || "";
          tx.value = n.content || "";
          document.getElementById("edit_id").value = n.id;
          document.getElementById("page_title").innerText = "Editar Anotação";

          // Gera o visual do Notion imediatamente
          pv.innerHTML = processNotionInput(tx.value);

          // Ajusta a altura para o texto não ficar cortado
          autoHeight(tx);

          // Muda o texto do botão
          document.getElementById("btnSave").innerText = "ATUALIZAR ANOTAÇÃO";

          // Importante: Limpa o dado de edição após carregar para não "sujar" a próxima nota nova
          localStorage.removeItem("edit_note_data");
        }

        // Mantém o ouvinte para digitação normal
        tx.addEventListener("input", () => {
          pv.innerHTML = processNotionInput(tx.value);
        });

        // Se for nota nova, foca no título. Se for edição, foca no final do texto.
        if (!localStorage.getItem("edit_note_data")) {
          document.getElementById("noteTitle").focus();
        }
      });
    </script>
  </body>
</html>
