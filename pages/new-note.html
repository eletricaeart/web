<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Nota | Elétrica & Art</title>
    <link rel="stylesheet" href="../assets/css/globals.css" />
    <script cjs src="../assets/js/cjs.js"></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/js/EASync.js"></script>
    <script src="../assets/components/BackButton.js" defer></script>
    <script src="../assets/components/ea/Text.js" defer></script>
    <script src="../assets/components/AppBar.js" defer></script>
    <script src="../assets/components/ea/EANotionEditor.js" defer></script>
    <style>
      body {
        background: #f0f2f5;
      }
      .container {
        display: flex;
        flex-flow: column;
        gap: 0 !important;
        flex: 1;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .container > label {
        margin: 0 !important;
        padding: 0 !important;
        gap: 0 !important;
        display: flex;
      }
      label.label-title {
        /* box-shadow: 0 3px 3px #0002; */
      }
      label.label-title > input {
        font-size: 1.3rem;
        font-weight: 600;
      }
      label.label-content {
        flex: 1;
      }
      .container > label input {
        gap: 0;
        display: flex;
        margin: 0 !important;
        background-color: transparent;
        border: 1px solid #ddd0;
      }

      .btn-save {
        background: #ffcc00;
        color: #333;
        width: 100%;
        font-size: 1.1em;
        height: 55px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
      }

      footer {
        display: flex;
        flex-flow: column;
        padding: 2rem;
        background-color: #f5f5f5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <input type="hidden" id="edit_id" />
      <label
        class="label-client"
        style="
          padding: 0 10px;
          margin-bottom: 10px;
          display: flex;
          flex-flow: row;
          align-items: center;
          border-bottom: 1px solid #eee;
        "
      >
        <span style="font-size: 0.8rem; color: #999; padding-left: 10px"
          >👤</span
        >
        <input
          type="text"
          id="noteClient"
          list="clients_list"
          placeholder="Vincular a um cliente (opcional)"
          style="font-size: 0.9rem; border: none; flex: 1; height: 40px"
        />
        <datalist id="clients_list"></datalist>
      </label>
      <label class="label-title">
        <input
          type="text"
          id="noteTitle"
          placeholder="Título"
          style="height: 50px; margin-bottom: 10px"
        />
      </label>

      <label class="label-content">
        <label class="label-content">
          <ea-editor id="noteEditor" placeholder="Notas..."></ea-editor>
        </label>
      </label>
    </div>
    <footer>
      <button onclick="saveNote()" class="btn-save" id="btnSave">
        SALVAR ANOTAÇÃO
      </button>
    </footer>

    <script>
      window.ea_config = { title: "Anotação" };

      // 1. Carrega a lista de clientes para o Datalist (Autocomplete)
      function loadClientsForDatalist() {
        const clients = JSON.parse(
          localStorage.getItem("ea_clients_cache") || "[]",
        );
        const datalist = document.getElementById("clients_list");
        datalist.innerHTML = clients
          .map((c) => `<option value="${c.name}" data-id="${c.id}">`)
          .join("");
      }

      async function saveNote() {
        const title = document.getElementById("noteTitle").value;
        const content = document.getElementById("noteEditor").value;
        const editId = document.getElementById("edit_id").value;
        const clientName = document.getElementById("noteClient").value;

        if (!content) return alert("O conteúdo da nota não pode estar vazio!");

        // Busca o ID do cliente baseado no nome digitado
        const clients = JSON.parse(
          localStorage.getItem("ea_clients_cache") || "[]",
        );
        const selectedClient = clients.find((c) => c.name === clientName);

        const payload = {
          id: editId || "NT-" + Date.now(),
          title: title || "Sem Título",
          content: content,
          data: new Date().toISOString(),
          clienteId: selectedClient ? selectedClient.id : "",
          clienteNome: clientName,
        };

        const btn = document.getElementById("btnSave");
        btn.innerText = "SALVANDO...";
        btn.disabled = true;

        // USO DO MOTOR EASync: Ele cuida do cache e do envio em segundo plano
        const result = await EASync.save("notes", payload);

        if (result.success || !editId) {
          window.location.href = "notes.html";
        } else {
          alert("Erro ao salvar no servidor, mas a nota foi salva localmente.");
          window.location.href = "notes.html";
        }
      }

      window.addEventListener("load", () => {
        loadClientsForDatalist();

        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get("id");
        const editor = document.getElementById("noteEditor");

        // Se tiver ID na URL, buscamos no cache para editar
        if (idParam) {
          const notes = JSON.parse(
            localStorage.getItem("ea_notes_cache") || "[]",
          );
          const n = notes.find((item) => item.id == idParam);

          if (n) {
            document.getElementById("noteTitle").value = n.title || "";
            document.getElementById("noteClient").value = n.clienteNome || "";
            if (editor) editor.value = n.content || "";
            document.getElementById("edit_id").value = n.id;

            document.getElementById("page_title").innerText = "Editar Anotação";
            document.getElementById("btnSave").innerText = "ATUALIZAR ANOTAÇÃO";
          }
        } else {
          document.getElementById("noteTitle").focus();
        }
      });
    </script>
  </body>
</html>
