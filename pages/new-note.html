<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Nota | Elétrica & Art</title>
    <link rel="stylesheet" href="../assets/css/globals.css" />
    <script cjs src="../assets/js/cjs.js"></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/components/BackButton.js" defer></script>
    <script src="../assets/components/ea/Text.js" defer></script>
    <script src="../assets/components/AppBar.js" defer></script>
    <script src="../assets/components/ea/EANotionEditor.js" defer></script>
    <style>
      body {
        background: #f0f2f5;
      }
      .container {
        display: flex;
        flex-flow: column;
        gap: 0 !important;
        flex: 1;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .container > label {
        margin: 0 !important;
        padding: 0 !important;
        gap: 0 !important;
        display: flex;
      }
      label.label-title {
        /* box-shadow: 0 3px 3px #0002; */
      }
      label.label-title > input {
        font-size: 1.3rem;
        font-weight: 600;
      }
      label.label-content {
        flex: 1;
      }
      .container > label input {
        gap: 0;
        display: flex;
        margin: 0 !important;
        background-color: transparent;
        border: 1px solid #ddd0;
      }

      .btn-save {
        background: #ffcc00;
        color: #333;
        width: 100%;
        font-size: 1.1em;
        height: 55px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
      }

      footer {
        display: flex;
        flex-flow: column;
        padding: 2rem;
        background-color: #f5f5f5;
      }
    </style>
  </head>
  <body>
    <page-header>
      <style>
        page-header {
          display: flex;
          flex-flow: column;
          padding: 2rem 1.5rem;
        }
      </style>
      <ea-text
        size="1.5rem"
        shadow="var(--sv-sodalita)"
        color="#fff"
        id="page_title"
        >Nova Anotação</ea-text
      >
    </page-header>
    <div class="container">
      <input type="hidden" id="edit_id" />
      <label class="label-title">
        <input
          type="text"
          id="noteTitle"
          placeholder="Título"
          style="height: 50px; margin-bottom: 10px"
        />
      </label>

      <label class="label-content">
        <label class="label-content">
          <ea-editor id="noteEditor" placeholder="Notas..."></ea-editor>
        </label>
      </label>
    </div>
    <footer>
      <button onclick="saveNote()" class="btn-save" id="btnSave">
        SALVAR ANOTAÇÃO
      </button>
    </footer>

    <script>
      async function saveNote() {
        const title = document.getElementById("noteTitle").value;
        const content = document.getElementById("noteEditor").value;
        const editId = document.getElementById("edit_id").value;
        if (!content) return alert("O conteúdo da nota não pode estar vazio!");

        const payload = {
          action: editId ? "update" : "save",
          id: editId,
          title: title,
          content: content,
          data: new Date().toLocaleDateString("pt-BR"),
        };

        try {
          await fetch(env.endpoints.notes, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify(payload),
          });
          // Injeta no cache para atualizar a lista sem esperar o servidor
          let cache = JSON.parse(
            localStorage.getItem("ea_notes_cache") || "[]",
          );
          if (editId) cache = cache.map((n) => (n.id == editId ? payload : n));
          else cache.push({ ...payload, id: "TEMP_" + Date.now() });
          localStorage.setItem("ea_notes_cache", JSON.stringify(cache));

          window.location.href = "notes.html";
        } catch (e) {
          alert("Erro ao salvar");
        }
      }

      window.addEventListener("load", () => {
        const editData = localStorage.getItem("edit_note_data");

        // Referência ao nosso novo componente
        const editor = document.getElementById("noteEditor");

        if (editData) {
          const n = JSON.parse(editData);

          // Preenche o título normalmente
          document.getElementById("noteTitle").value = n.title || "";

          // CORREÇÃO: Aqui você usa o ID do componente que definimos no HTML
          // O componente já cuida de atualizar o preview e a altura sozinho!
          if (editor) {
            editor.value = n.content || "";
          }

          document.getElementById("edit_id").value = n.id;
          document.getElementById("page_title").innerText = "Editar Anotação";
          document.getElementById("btnSave").innerText = "ATUALIZAR ANOTAÇÃO";

          localStorage.removeItem("edit_note_data");
        } else {
          // Se for nota nova, foca no título
          document.getElementById("noteTitle").focus();
        }
      });
    </script>
  </body>
</html>
