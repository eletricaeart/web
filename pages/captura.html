<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Captura de Orçamento | Elétrica & Art</title>
    <link rel="stylesheet" href="../assets/css/globals.css" />
    <script cjs src="../assets/js/cjs.js"></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/js/EASync.js"></script>
    <script src="../assets/components/BackButton.js" defer></script>
    <script src="../assets/components/ea/Text.js" defer></script>
    <script src="../assets/components/ea/PageHeader.js" defer></script>
    <script src="../assets/components/AppBar.js" defer></script>
    <script src="../assets/components/ea/EANotionEditor.js" defer></script>
    <script src="../assets/components/HelpModal.js" defer></script>
    <style>
      body {
        background: #f0f2f5;
        font-family: "Poppins", sans-serif;
      }
      .container {
        max-width: 850px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .container > content {
        gap: 0 !important;
      }
      .header-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        border-bottom: 2px solid #ffcc00;
        padding-bottom: 10px;
        padding: 2rem 1rem;
      }
      .btn-back {
        background: #333;
        color: white;
        padding: 8px 15px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.85em;
        font-weight: bold;
      }
      .grid-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 15px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: grid;
        font-weight: bold;
        color: #555;
        font-size: 0.9em;
        gap: 0;
        padding: 0.5rem 0;
      }
      input,
      select {
        width: 100%;
        height: 56px;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box;
        font-family: inherit;
      }
      view.input_clause-title {
        background-color: var(--sv-sodalita);
        width: 100%;
        height: calc(56px + 1rem);
        padding: 12px;
        flex-flow: row;
        border: 1px solid #ddd;
        border-radius: 1rem 1rem 0 0;
        box-sizing: border-box;
        font-family: inherit;
      }
      view.input_clause-title > text.clause-title-number {
        background-color: #e5e5e5;
        border-radius: 6px 0 0 6px;
        padding-left: 12px;
        padding-right: 0;
        font-size: 1rem;
        display: grid;
        place-items: center;
      }
      input.clause-title {
        height: 100%;
        border: transparent;
        border-radius: 0 6px 6px 0;
      }
      label > view {
        flex-flow: row;
        justify-content: space-between;
        margin: 0;
      }
      label > view text {
        padding: 0.5rem;
      }
      label > view text.label-text {
        border-radius: 9px 9px 0 0;
        background: #f5f5f5;
        border-top: 2px #e5e5e5 solid;
        border-left: 2px #e5e5e5 solid;
        border-right: 2px #e5e5e5 solid;
        box-shadow: inset #0002 0 -2px 6px;
      }
      label > view .label-help {
        background-color: #f2eadb;
        color: #ffab00;
        border-top: 2px #dac291 solid;
        border-left: 2px #dac291 solid;
        border-right: 2px #dac291 solid;
        border-radius: 9px 9px 0 0;
        margin-right: 0.8rem;
        box-shadow: inset #0002 0 -2px 6px;
      }
      textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box;
        font-family: inherit;
        field-sizing: content; /* Faz o elemento se comportar como uma div, crescendo com o conteúdo */
        min-height: 150px; /* Opcional: define uma altura inicial mínima */
        resize: none; /* Opcional: remove o controle de redimensionamento manual do usuário */
      }
      .item-content,
      .item-subtitle {
        border-radius: 0 9px 9px;
      }
      .clause-box {
        border: 0px solid #ffcc00;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        background: #fffdf5;
        background-color: #f5f5f5;
        position: relative;
      }
      .item-box {
        background: #fff;
        padding: 10px;
        margin: 10px 0;
        border: #0003 2px dashed;
        border-radius: 9px;
        position: relative;
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 6px;
        padding: 10px 15px;
        font-weight: bold;
        transition: 0.3s;
      }

      .btn-add_area {
        display: flex;
        align-items: center;
        justify-content: end;
        padding: 0 1.5rem;
      }
      .btn-add {
        background: var(--sv-sombra-azul);
        color: white;
        margin: 10px 0 20px;
      }
      .btn-item {
        background: #333;
        color: white;
        font-size: 0.8em;
        margin: 1rem 0;
      }
      .btn-save {
        background: #ffcc00;
        color: #333;
        width: 100%;
        font-size: 1.2em;
        margin-top: 30px;
        height: 55px;
      }
      .remove-btn {
        color: #ff4444;
        background: none;
        border: none;
        position: absolute;
        right: 0;
        top: 0;
        cursor: pointer;
      }
      .cep-loading {
        font-size: 0.8em;
        color: #28a745;
        display: none;
        margin-left: 5px;
      }
      footer {
        background: #f5f5f5;
        padding: 1rem;
      }
      footer input {
        cursor: pointer;
      }
      .capture-title {
        font-weight: 500;
        padding-left: 15px;
        color: #000;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <content>
        <page-header center shadow="#f00">Proposta de Orçamento</page-header>

        <div class="grid-row">
          <div class="form-group">
            <label>Data de Emissão</label>
            <input type="date" id="doc_emissao" />
          </div>
          <div class="form-group">
            <label>Validade da Proposta</label>
            <select id="doc_validade">
              <option value="7 dias">7 dias</option>
              <option value="15 dias" selected>15 dias</option>
              <option value="30 dias">30 dias</option>
            </select>
          </div>
        </div>

        <div class="form-group client-name_inputgroup">
          <style>
            .client-name_inputgroup {
            }
            .client-name_inputgroup > label {
              padding: 0 !important;
            }
            .client-name_labeltext {
              padding: 0;
            }
            .client-name_input {
            }
            .client-name_inputgroup .label-help {
            }
          </style>
          <label>
            <view class="client-name_input">
              <text class="client-name_labeltext"
                >Nome do Cliente / Empresa</text
              >
              <text
                class="label-help"
                onclick="goToCreateClient()"
                style="
                  background: #27f;
                  color: white;
                  border: none;
                  cursor: pointer;
                "
                >+ NOVO CLIENTE</text
              >
            </view>
          </label>
          <input
            type="text"
            id="c_name"
            list="clients_list"
            placeholder="Digite para buscar ou criar..."
            autofocus
          />
          <datalist id="clients_list"></datalist>
        </div>

        <div class="form-group">
          <label
            >CEP
            <span id="cep_status" class="cep-loading">Buscando...</span></label
          >
          <input type="text" id="c_cep" placeholder="00000-000" maxlength="9" />
        </div>
        <div class="grid-row" style="grid-template-columns: 3fr 1fr">
          <div class="form-group">
            <label>Logradouro (Rua/Av)</label>
            <input
              type="text"
              id="c_rua"
              placeholder="Av. President Kennedy ..."
            />
          </div>
          <div class="form-group">
            <label>Número</label>
            <input type="text" id="c_num" placeholder="Ex: 50" />
          </div>
        </div>
        <div class="form-group">
          <label>Bairro</label>
          <input type="text" id="c_bairro" placeholder="Ex: Aviação" />
        </div>
        <div class="form-group">
          <label>Cidade/UF</label>
          <input
            type="text"
            id="c_cidade"
            placeholder="Ex: Praia Grande - SP"
          />
        </div>

        <div class="form-group">
          <label>Título do Orçamento</label>
          <input
            type="text"
            id="doc_text"
            placeholder="SERVIÇOS DE ELÉTRICA (RESIDENCIAL)"
          />
        </div>

        <hr />
        <h3>Cláusulas e Itens</h3>
      </content>
      <div id="clauses_container"></div>
      <div class="btn-add_area">
        <button class="btn-add" onclick="addClause()">
          + Adicionar Cláusula
        </button>
      </div>
    </div>
    <footer>
      <input
        type="button"
        id="btn_save"
        class="btn-save"
        value="SALVAR ORÇAMENTO"
      />
    </footer>

    <script>
      /**
       * FUNÇÕES DE SUPORTE (Ponte Orçamento <-> Cliente)
       */

      // Captura TUDO que está na tela para não perder progresso antes de ir para "Novo Cliente"
      function saveCurrentProgressToDraft() {
        const clauses = [];
        document.querySelectorAll(".clause-box").forEach((clauseEl) => {
          const items = [];
          clauseEl.querySelectorAll(".item-box").forEach((itemEl) => {
            items.push({
              subtitulo: itemEl.querySelector(".item-subtitle").value,
              content: itemEl.querySelector("ea-editor").value,
            });
          });
          clauses.push({
            titulo: clauseEl.querySelector(".clause-title").value,
            items: items,
          });
        });

        return {
          docTitle: document.getElementById("doc_text").value,
          validade: document.getElementById("doc_validade").value,
          emissao: document.getElementById("doc_emissao").value,
          clauses: clauses,
        };
      }

      // Preenche os campos do cliente após selecionar ou voltar do cadastro
      function fillClientFields(c) {
        document.getElementById("c_name").value = c.name || "";
        document.getElementById("c_cep").value = c.cep || "";
        document.getElementById("c_rua").value = c.rua || "";
        document.getElementById("c_num").value = c.num || "";
        document.getElementById("c_bairro").value = c.bairro || "";
        document.getElementById("c_cidade").value = c.cidade || "";
      }

      // Salva rascunho e redireciona para criar novo cliente
      function goToCreateClient() {
        const draft = saveCurrentProgressToDraft();
        localStorage.setItem("ea_draft_budget", JSON.stringify(draft));
        window.location.href = "cliente.html";
      }

      /**
       * LÓGICA PRINCIPAL (Ao Carregar a Página)
       */
      window.addEventListener("load", () => {
        const hj = new Date().toISOString().split("T")[0];
        document.getElementById("doc_emissao").value = hj;

        const urlParams = new URLSearchParams(window.location.search);

        // MODO EDIÇÃO: Carrega dados do orçamento existente
        if (urlParams.get("edit") === "true") {
          const data = JSON.parse(localStorage.getItem("edit_budget_data"));
          if (data) {
            if (data.docTitle.emissao) {
              const [y, m, d] = data.docTitle.emissao.split("T")[0].split("-");
              document.getElementById("doc_emissao").value = `${y}-${m}-${d}`;
            }
            document.getElementById("c_name").value = data.cliente.name || "";
            document.getElementById("c_cep").value = data.cliente.cep || "";
            document.getElementById("c_rua").value = data.cliente.rua || "";
            document.getElementById("c_num").value = data.cliente.num || "";
            document.getElementById("c_bairro").value =
              data.cliente.bairro || "";
            document.getElementById("c_cidade").value =
              data.cliente.cidade || "";
            document.getElementById("doc_text").value =
              data.docTitle.text || "";
            document.getElementById("doc_validade").value =
              data.docTitle.validade || "15 dias";

            data.servicos.forEach((servico) => {
              const clauseId = addClause();
              const clauseEl = document.getElementById(`clause-${clauseId}`);
              clauseEl.querySelector(".clause-title").value = servico.titulo;
              servico.itens.forEach((item) => {
                const itemDiv = addItem(clauseId);
                itemDiv.querySelector(".item-subtitle").value = item.subtitulo;
                const textoReconstruido = item.detalhes
                  .map((d) => {
                    if (d.tipo === "brk") return "---";
                    if (d.tipo === "tagc") return `> ${d.conteudo}`;
                    if (d.tipo === "t6") return `# ${d.conteudo}`;
                    if (d.tipo === "ul")
                      return d.conteudo.map((li) => `- ${li}`).join("\n");
                    return d.conteudo;
                  })
                  .join("\n");
                const editor = itemDiv.querySelector("ea-editor");
                if (editor) editor.value = textoReconstruido;
              });
            });
            updateClauseNumbers();
            const btnSave = document.getElementById("btn_save");
            btnSave.value = "ATUALIZAR ORÇAMENTO";
            btnSave.dataset.editId = data.id;
          }
        }

        // MODO RESTAURAÇÃO: Volta da tela de "Novo Cliente" sem perder o que escreveu
        const isRestoring = urlParams.get("restore") === "true";
        if (isRestoring) {
          const draft = JSON.parse(localStorage.getItem("ea_draft_budget"));
          const newClient = JSON.parse(
            localStorage.getItem("ea_selected_client"),
          );

          if (draft) {
            document.getElementById("doc_text").value = draft.docTitle;
            document.getElementById("doc_validade").value = draft.validade;
            document.getElementById("doc_emissao").value = draft.emissao;
            draft.clauses.forEach((c) => {
              const clauseId = addClause();
              const clauseEl = document.getElementById(`clause-${clauseId}`);
              clauseEl.querySelector(".clause-title").value = c.titulo;
              c.items.forEach((it) => {
                const itemDiv = addItem(clauseId);
                itemDiv.querySelector(".item-subtitle").value = it.subtitulo;
                itemDiv.querySelector("ea-editor").value = it.content;
              });
            });
          }
          if (newClient) fillClientFields(newClient);

          localStorage.removeItem("ea_draft_budget");
          localStorage.removeItem("ea_selected_client");
        }

        // Popula a lista de busca de clientes (datalist)
        const clients = JSON.parse(
          localStorage.getItem("ea_clients_cache") || "[]",
        );
        const list = document.getElementById("clients_list");
        list.innerHTML = clients
          .map((c) => `<option value="${c.name}">`)
          .join("");

        if (
          urlParams.get("edit") !== "true" &&
          urlParams.get("restore") !== "true"
        ) {
          // 👉 Passamos 'false' aqui para criar a estrutura sem pular os campos do cabeçalho
          addClause(false);
        }
      });

      /**
       * EVENTOS DE INTERFACE
       */

      // Busca automática de CEP
      document.getElementById("c_cep").addEventListener("blur", async (e) => {
        let cep = e.target.value.replace(/\D/g, "");
        if (cep.length === 8) {
          document.getElementById("cep_status").style.display = "inline";
          try {
            const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
            const d = await res.json();
            if (!d.erro) {
              document.getElementById("c_rua").value = d.logradouro;
              document.getElementById("c_bairro").value = d.bairro;
              document.getElementById("c_cidade").value =
                `${d.localidade} - ${d.uf}`;
              document.getElementById("c_num").focus();
            }
          } catch (err) {
            console.error(err);
          } finally {
            document.getElementById("cep_status").style.display = "none";
          }
        }
      });

      // Detecta seleção no Datalist para preencher endereço automaticamente
      document.getElementById("c_name").addEventListener("change", (e) => {
        const clients = JSON.parse(
          localStorage.getItem("ea_clients_cache") || "[]",
        );
        const selected = clients.find((c) => c.name === e.target.value);
        if (selected) fillClientFields(selected);
      });

      /**
       * MANIPULAÇÃO DE CLÁUSULAS E ITENS (DOM)
       */
      function addClause(shouldFocus = true) {
        const container = document.getElementById("clauses_container");
        const id = Date.now() + Math.random();
        const div = document.createElement("div");
        div.className = "clause-box";
        div.id = `clause-${id}`;
        div.innerHTML = `
          <button class="remove-btn" onclick="removeClause('${id}')">Excluir</button>
          <label>Título da Cláusula</label>
          <view class="input_clause-title">
            <text class="clause-title-number"></text>
            <input type="text" class="clause-title" placeholder="Ex: Descrição dos Serviços" autofocus>
          </view>
          <div class="items-container" id="items-${id}"></div>
          <button class="btn-item" onclick="addItem('${id}')">+ Adicionar Subcláusula</button>
        `;
        container.appendChild(div);
        updateClauseNumbers();

        // Criamos a subcláusula automática (ela não deve roubar o foco agora)
        addItem(id, false); // Adicionamos um parâmetro 'false' para não focar automaticamente

        // Só aplica o foco se o parâmetro for true (clique no botão)
        if (shouldFocus) {
          const inputTitulo = div.querySelector(".clause-title");
          if (inputTitulo) {
            inputTitulo.focus();
          }
        }

        return id;
      }

      function removeClause(id) {
        const el = document.getElementById(`clause-${id}`);
        if (el) {
          el.remove();
          updateClauseNumbers();
        }
      }

      function updateClauseNumbers() {
        document.querySelectorAll(".clause-box").forEach((clause, index) => {
          const tag = clause.querySelector(".clause-title-number");
          if (tag) tag.innerText = `${index + 1}.`;
        });
      }

      function addItem(clauseId, shouldFocus = true) {
        const container = document.getElementById(`items-${clauseId}`);
        const id = Date.now() + Math.random();
        const div = document.createElement("div");
        div.className = "item-box";
        div.id = `item-${id}`;
        div.innerHTML = `
          <button class="remove-btn" onclick="document.getElementById('item-${id}').remove()">Remover</button>
          <label><view><text class="label-text">Subtítulo</text></view>
          <input type="text" class="item-subtitle" placeholder="Ex: Cozinha"></label>
          <label><view><text class="label-text">Conteúdo</text><text class="label-help">ajuda</text></view>
          <ea-editor class="item-content-editor" placeholder="Digite - para lista..."></ea-editor></label>
        `;
        container.appendChild(div);

        // Só aplica o foco se o parâmetro for true
        if (shouldFocus) {
          const inputSubtitulo = div.querySelector(".item-subtitle");
          if (inputSubtitulo) {
            setTimeout(() => inputSubtitulo.focus(), 10);
          }
        }

        return div;
      }

      /**
       * PERSISTÊNCIA (Salvar no Google Sheets / Cache)
       */
      /**
       * PERSISTÊNCIA (Salvar via Motor EASync)
       */
      document
        .getElementById("btn_save")
        .addEventListener("click", async () => {
          const btn = document.getElementById("btn_save");
          const editId = btn.dataset.editId;

          // 1. Bloqueia o botão para evitar cliques duplos
          btn.disabled = true;
          btn.value = "PROCESSANDO...";

          try {
            // Coleta de dados do endereço e cabeçalho
            const rua = document.getElementById("c_rua").value;
            const num = document.getElementById("c_num").value;
            const bairro = document.getElementById("c_bairro").value;
            const cidade = document.getElementById("c_cidade").value;
            const cep = document.getElementById("c_cep").value;

            // Formatação da data para o padrão brasileiro DD/MM/YYYY
            const dateInput = document.getElementById("doc_emissao").value;
            const dateParts = dateInput.split("-");
            const formattedDate = `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`;

            // 2. Montagem do Objeto Principal (Payload)
            const payload = {
              id: editId || "TEMP_" + Date.now(), // Se for novo, gera um ID temporário
              cliente: {
                name: document.getElementById("c_name").value,
                cep: cep,
                rua: rua,
                num: num,
                bairro: bairro,
                cidade: cidade,
              },
              docTitle: {
                subtitle: "PROPOSTA DE ORÇAMENTO",
                emissao: formattedDate,
                validade: document.getElementById("doc_validade").value,
                text: document.getElementById("doc_text").value,
              },
              servicos: [],
            };

            // 3. Varredura das Cláusulas e Itens (Conversão para o formato GS)
            document.querySelectorAll(".clause-box").forEach((clauseEl) => {
              const servico = {
                titulo: clauseEl.querySelector(".clause-title").value,
                itens: [],
              };

              clauseEl.querySelectorAll(".item-box").forEach((itemEl) => {
                const editorValue = itemEl.querySelector("ea-editor").value;
                const detalhes = [];

                // Processamento de Markdown para Objetos (Lógica para o Google Sheets)
                editorValue.split("\n").forEach((line) => {
                  const tl = line.trim();
                  if (!tl) return;

                  if (tl === "---") {
                    detalhes.push({ tipo: "brk", conteudo: "" });
                  } else if (tl.startsWith(">")) {
                    detalhes.push({
                      tipo: "tagc",
                      conteudo: tl.replace(">", "").trim(),
                    });
                  } else if (tl.startsWith("#")) {
                    detalhes.push({
                      tipo: "t6",
                      conteudo: tl.replace("#", "").trim(),
                    });
                  } else if (tl.startsWith("*") || tl.startsWith("-")) {
                    let last = detalhes[detalhes.length - 1];
                    const mark = tl.startsWith("*") ? "*" : "-";
                    const content = tl.replace(mark, "").trim();

                    if (last && last.tipo === "ul") {
                      last.conteudo.push(content);
                    } else {
                      detalhes.push({ tipo: "ul", conteudo: [content] });
                    }
                  } else {
                    detalhes.push({ tipo: "p", conteudo: tl });
                  }
                });

                servico.itens.push({
                  subtitulo: itemEl.querySelector(".item-subtitle").value,
                  detalhes: detalhes,
                });
              });
              payload.servicos.push(servico);
            });

            // 4. O PULO DO GATO: Envia para o motor EASync
            // O motor vai salvar no cache local, avisar a Dashboard e tentar enviar ao GS em background
            const action = editId ? "update" : "create";
            const result = await EASync.save("orcamentos", payload, action);

            if (result.success || !editId) {
              // Limpa rascunhos de navegação se existirem
              localStorage.removeItem("ea_draft_budget");
              localStorage.removeItem("ea_selected_client");

              // Redireciona para a lista
              window.location.href = "dashboard.html";
            } else {
              throw new Error("Erro ao sincronizar com o servidor.");
            }
          } catch (err) {
            console.error("Falha ao salvar orçamento:", err);
            alert(
              "Erro ao salvar! O orçamento foi mantido no cache, mas não pôde ser enviado.",
            );
            btn.disabled = false;
            btn.value = "TENTAR SALVAR NOVAMENTE";
          }
        });

      // Delegar ajuda
      document.addEventListener("click", (e) => {
        if (
          e.target.classList.contains("label-help") &&
          e.target.innerText === "ajuda"
        ) {
          if (typeof showHelp === "function") showHelp();
        }
      });
    </script>
  </body>
</html>
