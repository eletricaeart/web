<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Captura de Orçamento | Elétrica & Art</title>
    <link rel="stylesheet" href="../assets/globals.css" />
    <script cjs src="../assets/cjs.js"></script>
    <script src="../assets/env.js"></script>
    <style>
      body {
        background: #f0f2f5;
        font-family: "Poppins", sans-serif;
        padding: 20px;
      }
      .container {
        max-width: 850px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .header-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        border-bottom: 2px solid #ffcc00;
        padding-bottom: 10px;
      }
      .btn-back {
        background: #333;
        color: white;
        padding: 8px 15px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.85em;
        font-weight: bold;
      }

      .grid-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 15px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
        color: #555;
        font-size: 0.9em;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box;
        font-family: inherit;
      }

      .clause-box {
        border: 1px solid #ffcc00;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        background: #fffdf5;
        position: relative;
      }
      .item-box {
        background: #fff;
        border-left: 4px solid #333;
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
        position: relative;
      }

      button {
        cursor: pointer;
        border: none;
        border-radius: 6px;
        padding: 10px 15px;
        font-weight: bold;
        transition: 0.3s;
      }
      .btn-add {
        background: #28a745;
        color: white;
        margin: 10px 0 20px;
      }
      .btn-item {
        background: #333;
        color: white;
        font-size: 0.8em;
      }
      .btn-save {
        background: #ffcc00;
        color: #333;
        width: 100%;
        font-size: 1.2em;
        margin-top: 30px;
        height: 55px;
      }
      .remove-btn {
        color: #ff4444;
        background: none;
        border: none;
        position: absolute;
        right: 10px;
        top: 10px;
        cursor: pointer;
        font-size: 0.8em;
      }
      .cep-loading {
        font-size: 0.8em;
        color: #28a745;
        display: none;
        margin-left: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header-nav">
        <h1>Novo Orçamento</h1>
        <a href="dashboard.html" class="btn-back">← Voltar ao Dashboard</a>
      </div>

      <div class="grid-row">
        <div class="form-group">
          <label>Data de Emissão</label>
          <input type="date" id="doc_emissao" />
        </div>
        <div class="form-group">
          <label>Validade da Proposta</label>
          <select id="doc_validade">
            <option value="1 dia">1 dia</option>
            <option value="2 dias">2 dias</option>
            <option value="3 dias">3 dias</option>
            <option value="7 dias">7 dias</option>
            <option value="15 dias" selected>15 dias</option>
            <option value="30 dias">30 dias</option>
            <option value="60 dias">60 dias</option>
            <option value="90 dias">90 dias</option>
            <option value="120 dias">120 dias</option>
            <option value="12 meses">12 meses</option>
            <option value="24 meses">24 meses</option>
            <option value="36 meses">36 meses</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Nome do Cliente / Empresa</label>
        <input type="text" id="c_name" placeholder="Ex: João Silva" />
      </div>

      <div class="grid-row" style="grid-template-columns: 1fr 2fr">
        <div class="form-group">
          <label
            >CEP
            <span id="cep_status" class="cep-loading">Buscando...</span></label
          >
          <input type="text" id="c_cep" placeholder="00000-000" maxlength="9" />
        </div>
        <div class="form-group">
          <label>Logradouro (Rua/Av)</label>
          <input type="text" id="c_rua" placeholder="Rua Maria de Lourdes..." />
        </div>
      </div>
      <div class="grid-row" style="grid-template-columns: 1fr 1fr 1fr">
        <div class="form-group">
          <label>Número</label>
          <input type="text" id="c_num" placeholder="Ex: 50" />
        </div>
        <div class="form-group">
          <label>Bairro</label>
          <input type="text" id="c_bairro" placeholder="Ex: Caiçara" />
        </div>
        <div class="form-group">
          <label>Cidade/UF</label>
          <input
            type="text"
            id="c_cidade"
            placeholder="Ex: Praia Grande - SP"
          />
        </div>
      </div>

      <div class="form-group">
        <label>Título do Orçamento</label>
        <input
          type="text"
          id="doc_text"
          placeholder="SERVIÇOS DE ELÉTRICA (RESIDENCIAL)"
        />
      </div>

      <hr />
      <h3>Cláusulas e Itens</h3>
      <div id="clauses_container"></div>
      <button class="btn-add" onclick="addClause()">
        + Adicionar Cláusula
      </button>

      <button class="btn-save" id="btn_save">SALVAR ORÇAMENTO</button>
    </div>

    <script>
      // Configura data atual no input
      window.addEventListener("load", () => {
        const hj = new Date().toISOString().split("T")[0];
        document.getElementById("doc_emissao").value = hj;
      });

      // Busca de CEP via API ViaCEP
      document.getElementById("c_cep").addEventListener("blur", async (e) => {
        let cep = e.target.value.replace(/\D/g, "");
        if (cep.length === 8) {
          document.getElementById("cep_status").style.display = "inline";
          try {
            const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
            const d = await res.json();
            if (!d.erro) {
              document.getElementById("c_rua").value = d.logradouro;
              document.getElementById("c_bairro").value = d.bairro;
              document.getElementById("c_cidade").value =
                `${d.localidade} - ${d.uf}`;
              document.getElementById("c_num").focus();
            }
          } catch (err) {
            console.error(err);
          } finally {
            document.getElementById("cep_status").style.display = "none";
          }
        }
      });

      function addClause() {
        const container = document.getElementById("clauses_container");
        const id = Date.now();
        const div = document.createElement("div");
        div.className = "clause-box";
        div.id = `clause-${id}`;
        div.innerHTML = `
            <button class="remove-btn" onclick="document.getElementById('clause-${id}').remove()">Excluir</button>
            <label>Título da Cláusula</label>
            <input type="text" class="clause-title" placeholder="Ex: 1. Descrição dos Serviços">
            <div class="items-container" id="items-${id}"></div>
            <button class="btn-item" onclick="addItem('${id}')">+ Adicionar Subcláusula</button>
        `;
        container.appendChild(div);
      }

      function addItem(clauseId) {
        const container = document.getElementById(`items-${clauseId}`);
        const id = Date.now();
        const div = document.createElement("div");
        div.className = "item-box";
        div.id = `item-${id}`;
        div.innerHTML = `
            <button class="remove-btn" onclick="document.getElementById('item-${id}').remove()">Remover</button>
            <label>Subtítulo</label>
            <input type="text" class="item-subtitle" placeholder="Ex: Cozinha">
            <label>Conteúdo (Hífen '-' para listas)</label>
            <textarea class="item-content" rows="3"></textarea>
        `;
        container.appendChild(div);
      }

      document
        .getElementById("btn_save")
        .addEventListener("click", async () => {
          const btn = document.getElementById("btn_save");
          btn.disabled = true;
          btn.textContent = "ENVIANDO...";

          // Formatação do Endereço Completo
          const rua = document.getElementById("c_rua").value;
          const num = document.getElementById("c_num").value;
          const bairro = document.getElementById("c_bairro").value;
          const cidade = document.getElementById("c_cidade").value;
          const fullAddress = `${rua}${num ? ", nº " + num : ""}${bairro ? " - " + bairro : ""}, ${cidade}`;

          // Correção da Data de Emissão (Extrai apenas YYYY-MM-DD do input e converte para DD/MM/YYYY)
          const dateParts = document
            .getElementById("doc_emissao")
            .value.split("-");
          const formattedDate = `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`;

          const payload = {
            title: "Elétrica & Art-Orçamento",
            cliente: {
              name: document.getElementById("c_name").value,
              address: fullAddress,
            },
            docTitle: {
              subtitle: "PROPOSTA DE ORÇAMENTO",
              emissao: formattedDate,
              validade: document.getElementById("doc_validade").value,
              text: document.getElementById("doc_text").value,
            },
            servicos: [],
          };

          // Captura das Cláusulas Dinâmicas
          document.querySelectorAll(".clause-box").forEach((clauseEl) => {
            const servico = {
              titulo: clauseEl.querySelector(".clause-title").value,
              itens: [],
            };
            clauseEl.querySelectorAll(".item-box").forEach((itemEl) => {
              const content = itemEl.querySelector(".item-content").value;
              const detalhes = [];
              content.split("\n").forEach((line) => {
                if (line.trim().startsWith("-")) {
                  let last = detalhes[detalhes.length - 1];
                  if (last && last.tipo === "ul")
                    last.conteudo.push(line.replace("-", "").trim());
                  else
                    detalhes.push({
                      tipo: "ul",
                      conteudo: [line.replace("-", "").trim()],
                    });
                } else if (line.trim() !== "") {
                  detalhes.push({ tipo: "p", conteudo: line });
                }
              });
              servico.itens.push({
                subtitulo: itemEl.querySelector(".item-subtitle").value,
                detalhes,
              });
            });
            payload.servicos.push(servico);
          });

          try {
            await fetch(env.endpoint, {
              method: "POST",
              mode: "no-cors",
              body: JSON.stringify(payload),
            });
            alert("Orçamento salvo com sucesso!");
            window.location.href = "dashboard.html";
          } catch (error) {
            alert("Erro ao conectar com o Google Sheets.");
            console.error(error);
          } finally {
            btn.disabled = false;
            btn.textContent = "SALVAR ORÇAMENTO";
          }
        });
    </script>
  </body>
</html>
