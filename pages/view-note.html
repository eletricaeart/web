<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ver Nota | Elétrica & Art</title>
    <link rel="stylesheet" href="../assets/css/globals.css" />
    <script cjs src="../assets/js/cjs.js"></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/components/ea/Text.js" defer></script>
    <script src="../assets/components/ea/EANotionEditor.js" defer></script>
    <script src="../assets/js/helpers.js" defer></script>
    <script src="../assets/components/BackButton.js" defer></script>
    <script src="../assets/components/AppBar.js" defer></script>
    <script src="../assets/components/FAB2.js" defer></script>
    <style>
      body {
        background: white;
      }
      .note-content {
        padding: 25px;
        line-height: 1.6;
        font-size: 1.1rem;
        color: #333;
        white-space: pre-wrap;
      }
      .note-header {
        background: #f0f2f5;
        padding: 20px;
        border-bottom: 2px solid #ffcc00;
      }
    </style>
  </head>
  <body>
    <div class="note-header">
      <small id="note_date" style="color: #666"></small>
      <h2 style="margin: 0; color: var(--sv-sombra-azul)">Anotação Técnica</h2>
    </div>

    <div id="note_body" class="note-content">Carregando...</div>

    <script>
      let currentNote = null;
      const whatsappIconPath = "../assets/imgs/icons/whatsapp1.svg";
      const trashIcon = "../assets/imgs/icons/trash.svg";
      const fileEditIcon = "../assets/imgs/icons/file-edit.svg";

      /* whatsapp share logic */
      function formatForWhatsApp(title, content) {
        let text = `*ELÉTRICA & ART*\n`;
        text += `_${getCleanDate(currentNote.data)}_\n\n`;
        // const cleanDate = getCleanDate(  );

        if (title) text += `*${title.toUpperCase()}*\n\n`;

        // Traduz linha a linha
        const lines = content.split("\n");
        const formattedLines = lines.map((line) => {
          const tl = line.trim();
          if (tl.startsWith("- ") || tl.startsWith("* "))
            return `• ${line.substring(2)}`; // Bolinha visual
          if (tl.startsWith("> ")) return `_> ${line.substring(2)}_`; // Itálico para citações
          if (tl.startsWith("# "))
            return `*${line.substring(2).toUpperCase()}*`; // Títulos em negrito
          if (tl === "---") return `__________________________`; // Divisor visual
          return line;
        });

        text += formattedLines.join("\n");
        return encodeURIComponent(text); // Prepara para a URL
      }

      function shareWhatsApp() {
        const text = formatForWhatsApp(currentNote.title, currentNote.content);
        // const url = `https://api.whatsapp.com/send?text=${text}`;
        const url = `https://wa.me/?text=${text}`;
        window.open(url, "_blank");
      }
      /* --- end whatsapp share logic */

      async function init() {
        const id = new URLSearchParams(window.location.search).get("id");
        const cache = JSON.parse(
          localStorage.getItem("ea_notes_cache") || "[]",
        );
        currentNote = cache.find((n) => n.id == id);

        if (currentNote) {
          // Atualiza o h2 ou cria um elemento para o título
          const titleArea = document.querySelector(".note-header h2");
          titleArea.innerText = currentNote.title || "Anotação Técnica";

          document.getElementById("note_date").innerText = getCleanDate(
            currentNote.data,
          );

          // CORREÇÃO: Em vez de innerText, usamos a função de conversão e injetamos como HTML
          /*const formattedHTML = processNotionInput(currentNote.content);
          document.getElementById("note_body").innerHTML = formattedHTML;
          */
          const contentRaw = currentNote.content; // ou orcamento.item.detalhes convertido em string
          document.getElementById("note_body").innerHTML =
            EANotionEditor.processText(contentRaw);

          createFAB([
            {
              // icon: "✏️",
              icon: `<img src="${fileEditIcon}" style="filter: brightness(0) saturate(100%) invert(18%) sepia(0%) decode(0%);" /`, // Você pode usar um emoji 💬 se preferir
              label: "Editar",
              action: () => {
                localStorage.setItem(
                  "edit_note_data",
                  JSON.stringify(currentNote),
                );
                window.location.href = "new-note.html";
              },
            },
            {
              icon: `<img src="${whatsappIconPath}" style="filter: brightness(0) saturate(100%) invert(18%) sepia(0%) decode(0%);" /`, // Você pode usar um emoji 💬 se preferir
              label: "Enviar via WhatsApp",
              action: shareWhatsApp,
            },
            {
              icon: `<img src="${trashIcon}" style="filter: brightness(0) saturate(100%) invert(18%) sepia(0%) decode(0%);" /`,
              label: "Excluir",
              action: deleteNote,
            },
          ]);
        }
        // função de processamento aqui também para a visualização
        function processNotionInput(text) {
          if (!text) return "";
          let lines = text.split("\n");
          return lines
            .map((line) => {
              if (line.startsWith("- ") || line.startsWith("* "))
                return `<li style="margin-left:20px; color:#555;">${line.substring(2)}</li>`;
              if (line.startsWith("> "))
                return `<div class="tagc" style="display:block; padding:1em; background:#29f2; color:#0075bd; font-weight:800; border-radius:12px; margin:10px 0;">${line.substring(2)}</div>`;
              if (line.startsWith("# "))
                return `<h2 style="color:var(--sv-sombra-azul); margin:15px 0 5px;">${line.substring(2)}</h2>`;
              if (line === "---")
                return `<hr style="border:none; border-top:2px solid #ffcc00; margin:20px 0;">`;
              return `<p style="margin:5px 0;">${line}</p>`;
            })
            .join("");
        }
      }

      async function deleteNote() {
        if (!confirm("Apagar nota permanentemente?")) return;
        try {
          await fetch(env.endpoints.notes, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({ action: "delete", id: currentNote.id }),
          });
          window.location.href = "notes.html";
        } catch (e) {
          alert("Erro ao deletar");
        }
      }

      window.addEventListener("load", init);
    </script>
  </body>
</html>
