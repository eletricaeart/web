<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ver Nota | Elétrica & Art</title>
    <link rel="stylesheet" href="../assets/css/globals.css" />
    <script cjs src="../assets/js/cjs.js"></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/components/ea/Text.js" defer></script>
    <script src="../assets/components/BackButton.js" defer></script>
    <script src="../assets/components/AppBar.js" defer></script>
    <script src="../assets/components/FAB2.js" defer></script>
    <style>
      body {
        background: white;
      }
      .note-content {
        padding: 25px;
        line-height: 1.6;
        font-size: 1.1rem;
        color: #333;
        white-space: pre-wrap;
      }
      .note-header {
        background: #f0f2f5;
        padding: 20px;
        border-bottom: 2px solid #ffcc00;
      }
    </style>
  </head>
  <body>
    <div class="note-header">
      <small id="note_date" style="color: #666"></small>
      <h2 style="margin: 0; color: var(--sv-sombra-azul)">Anotação Técnica</h2>
    </div>

    <div id="note_body" class="note-content">Carregando...</div>

    <script>
      let currentNote = null;

      async function init() {
        const id = new URLSearchParams(window.location.search).get("id");
        const cache = JSON.parse(
          localStorage.getItem("ea_notes_cache") || "[]",
        );
        currentNote = cache.find((n) => n.id == id);

        if (currentNote) {
          // Atualiza o h2 ou cria um elemento para o título
          const titleArea = document.querySelector(".note-header h2");
          titleArea.innerText = currentNote.title || "Anotação Técnica";

          document.getElementById("note_date").innerText =
            "Registrado em: " + currentNote.data;

          // CORREÇÃO: Em vez de innerText, usamos a função de conversão e injetamos como HTML
          const formattedHTML = processNotionInput(currentNote.content);
          document.getElementById("note_body").innerHTML = formattedHTML;

          createFAB([
            {
              icon: "✏️",
              label: "Editar",
              action: () => {
                localStorage.setItem(
                  "edit_note_data",
                  JSON.stringify(currentNote),
                );
                window.location.href = "new-note.html";
              },
            },
            { icon: "🗑️", label: "Excluir", action: deleteNote },
          ]);
        }
        // função de processamento aqui também para a visualização
        function processNotionInput(text) {
          if (!text) return "";
          let lines = text.split("\n");
          return lines
            .map((line) => {
              if (line.startsWith("- ") || line.startsWith("* "))
                return `<li style="margin-left:20px; color:#555;">${line.substring(2)}</li>`;
              if (line.startsWith("> "))
                return `<div class="tagc" style="display:block; padding:1em; background:#29f2; color:#0075bd; font-weight:800; border-radius:12px; margin:10px 0;">${line.substring(2)}</div>`;
              if (line.startsWith("# "))
                return `<h2 style="color:var(--sv-sombra-azul); margin:15px 0 5px;">${line.substring(2)}</h2>`;
              if (line === "---")
                return `<hr style="border:none; border-top:2px solid #ffcc00; margin:20px 0;">`;
              return `<p style="margin:5px 0;">${line}</p>`;
            })
            .join("");
        }
      }

      async function deleteNote() {
        if (!confirm("Apagar nota permanentemente?")) return;
        try {
          await fetch(env.endpoints.notes, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({ action: "delete", id: currentNote.id }),
          });
          window.location.href = "notes.html";
        } catch (e) {
          alert("Erro ao deletar");
        }
      }

      window.addEventListener("load", init);
    </script>
  </body>
</html>
