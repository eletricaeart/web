<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Elétrica & Art</title>
    <link rel="stylesheet" href="../assets/css/globals.css" />
    <script cjs src="../assets/js/cjs.js"></script>
    <script src="../assets/js/helpers.js"></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/components/widgets.js" defer></script>
    <script src="../assets/components/BackButton.js" defer></script>
    <script src="../assets/components/Text.js" defer></script>
    <script src="../assets/components/AppBar.js" defer></script>
    <script src="../assets/components/FAB2.js" defer></script>
    <style>
      body {
        background: #f0f2f5;
        font-family: "Poppins", sans-serif;
      }
      main.page {
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
      }
      main.page > ui {
        padding: 1rem;
      }
      .dash {
        position: sticky;
        top: 72px;
      }
      .header-dash {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .orcamento-card {
        background: white;
        padding: 20px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: 0.3s;
        border-radius: 13px;
        border-left: 6px solid #ffcc00;
      }
      .orcamento-card:nth-child(even) {
        border-left-color: #27f;
      }
      .info h3 {
        margin: 0;
        color: #333;
        font-size: 1.1rem;
      }
      .info p {
        margin: 5px 0 0;
        color: #777;
        font-size: 0.85em;
      }
      .actions a {
        background: #333;
        color: white;
        padding: 8px 15px;
        border-radius: 5px;
        text-decoration: none;
        font-size: 0.8em;
        font-weight: bold;
      }
      .loading {
        text-align: center;
        padding: 50px;
        color: #777;
      }
    </style>
  </head>
  <body>
    <div id="loading_overlay" style="display: none">
      <div class="spinner"></div>
      <t>Sincronizando orçamentos...</t>
    </div>
    <main class="page">
      <header class="dash">
        <div class="header-dash" id="dash_title">
          <h1>Orçamentos</h1>
        </div>
        <div class="search-container" style="margin-bottom: 1.5rem">
          <input
            type="text"
            id="searchInput"
            placeholder="🔍 Buscar cliente ou serviço..."
            style="
              height: 50px;
              border-radius: 12px;
              border: 1px solid #ddd;
              padding: 0 15px;
              width: 100%;
            "
          />
        </div>
      </header>
      <ui>
        <div id="list_container">
          <div class="loading">Carregando dados...</div>
        </div>
      </ui>
    </main>

    <script>
      const API_URL = env.endpoints.budgets;
      const CACHE_KEY = "ea_orcamentos_cache";
      let allOrcamentos = [];

      function renderList(orcamentos) {
        const container = document.getElementById("list_container");
        container.innerHTML = orcamentos.length
          ? ""
          : "<p>Nenhum resultado encontrado.</p>";

        orcamentos
          .slice()
          .reverse()
          .forEach((orc) => {
            const dataEmissao = getCleanDate(orc.docTitle.emissao);
            const card = document.createElement("div");
            card.className = "orcamento-card";
            card.innerHTML = `
            <div class="info">
                <small style="color:#999">${dataEmissao}</small>
                <h3>${orc.cliente.name || "Sem Nome"}</h3>
                <p>${orc.docTitle.text || "Sem Título"}</p>
            </div>
            <div class="actions">
                <a href="orcamento.html?id=${orc.id}" target="_blank">PDF</a>
            </div>
          `;
            container.appendChild(card);
          });
      }

      async function loadData(forceRefresh = false) {
        const cachedData = localStorage.getItem(CACHE_KEY);
        if (cachedData && !forceRefresh) {
          allOrcamentos = JSON.parse(cachedData);
          renderList(allOrcamentos);
          return;
        }
        await fetchAndCache();
      }

      async function fetchAndCache() {
        const overlay = document.getElementById("loading_overlay");
        overlay.style.display = "flex";
        try {
          const response = await fetch(API_URL);
          allOrcamentos = await response.json();
          localStorage.setItem(CACHE_KEY, JSON.stringify(allOrcamentos));
          renderList(allOrcamentos);
        } catch (error) {
          console.error(error);
          document.getElementById("list_container").innerHTML =
            "<p>Erro ao conectar com a nuvem.</p>";
        } finally {
          overlay.style.display = "none";
        }
      }

      document.getElementById("searchInput").on("input", (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allOrcamentos.filter(
          (orc) =>
            orc.cliente.name.toLowerCase().includes(term) ||
            orc.docTitle.text.toLowerCase().includes(term),
        );
        renderList(filtered);
      });

      window.addEventListener("load", () => {
        /*createThunderText({
          text: "Orçamentos",
          size: "1.8rem",
          color: "#333",
          target: "#dash_title",
        });*/

        dash_title.innerHTML = tt({
          tag: "h1",
          text: "Orçamentos",
        });

        loadData();
        createFAB([
          { icon: "✍️", label: "Novo Orçamento", action: `captura.html` },
          { icon: "🔄", label: "Sincronizar", action: () => loadData(true) },
        ]);
      });
    </script>
  </body>
</html>
