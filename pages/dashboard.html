<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Elétrica & Art</title>
    <link rel="stylesheet" href="../assets/css/globals.css" />
    <script cjs src="../assets/js/cjs.js"></script>
    <script src="../assets/js/helpers.js"></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/components/widgets.js" defer></script>
    <script src="../assets/components/BackButton.js" defer></script>
    <script src="../assets/components/ea/Text.js" defer></script>
    <script src="../assets/components/AppBar.js" defer></script>
    <script src="../assets/components/FAB2.js" defer></script>
    <script src="../assets/components/ea/EAModal.js" defer></script>
    <style>
      html {
        background: #f0f2f5;
      }
      body {
        background: #f0f2f5;
        font-family: "Poppins", sans-serif;
      }
      main.page {
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
        padding-bottom: 100px;
      }
      main.page > ui {
        padding: 1rem;
      }
      .dash {
        position: sticky;
        top: 72px;
        z-index: 10;
        background: #f0f2f5;
        padding: 1rem;
      }
      .header-dash {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.8rem;
        padding: 1rem;
      }
      .orcamento-card {
        background: white;
        padding: 20px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: 0.3s;
        border-radius: 13px;
        border-left: 6px solid #ffcc00;
      }
      .orcamento-card:nth-child(even) {
        border-left-color: #27f;
      }
      .info h3 {
        margin: 0;
        color: #333;
        font-size: 1.1rem;
      }
      .info p {
        margin: 5px 0 0;
        color: #777;
        font-size: 0.85em;
      }
      .actions a {
        background: #333;
        color: white;
        padding: 8px 15px;
        border-radius: 5px;
        text-decoration: none;
        font-size: 0.8em;
        font-weight: bold;
      }
      .loading {
        text-align: center;
        padding: 50px;
        color: #777;
      }
      .status-label {
        font-size: 0.7em;
        font-weight: bold;
        color: #ffab00;
        text-transform: uppercase;
      }
      textarea {
        field-sizing: content; /* Faz o elemento se comportar como uma div, crescendo com o conteúdo */
        min-height: 50px; /* Opcional: define uma altura inicial mínima */
        resize: none; /* Opcional: remove o controle de redimensionamento manual do usuário */
      }

      /* Estilos para o Menu de Opções (Dropdown) */
      .options-container {
        position: relative;
      }
      .btn-options {
        background: none;
        border: none;
        font-size: 1.6rem;
        cursor: pointer;
        padding: 0 10px;
        color: #777;
        border-radius: 50%;
        transition: background 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn-options:hover {
        background: #f0f0f0;
      }
      .options-menu {
        display: none;
        position: absolute;
        top: 40px;
        right: 0;
        background: white;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        border-radius: 10px;
        z-index: 1000;
        min-width: 160px;
        overflow: hidden;
        border: 1px solid #eee;
      }
      .options-menu.active {
        display: flex;
        flex-direction: column;
        animation: fadeIn 0.2s ease-out;
      }
      .menu-item {
        padding: 12px 18px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        font-size: 0.9rem;
        color: #444;
        transition: background 0.2s;
        text-align: left;
        border: none;
        background: none;
        width: 100%;
        font-family: inherit;
        font-weight: 500;
      }
      .menu-item:hover {
        background: #f8f9fa;
        color: var(--sv-sombra-azul);
      }
      .menu-item.delete {
        color: #ff4444;
        border-top: 1px solid #f5f5f5;
      }
      .menu-item.delete:hover {
        background: #fff5f5;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
    <style loading-skeleton>
      /* Skeleton para Dashboard */
      #loading_overlay {
        display: none;
        position: fixed;
        top: 72px; /* Abaixo da AppBar */
        top: 215px; /* Altura aproximada: AppBar (72px) + Header Dash + Padding */
        left: 0;
        width: 100%;
        height: calc(100vh - 72px);
        height: calc(100vh - 215px);
        background: #f0f2f5;
        z-index: 8000;
        padding: 1rem;
        overflow: hidden;
        transition: opacity 0.4s ease;
      }
      /* Regra para esconder a busca durante o loading */
      body.is-loading .search-container {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        transition: 0.3s;
      }
      #loading_overlay.active {
        display: block; /* Mostra quando ativo */
        opacity: 1;
        pointer-events: all;
      }
      #loading_overlay.hidden {
        opacity: 0;
        pointer-events: none; /* Garante que o Rafael consiga clicar nos cards por baixo */
      }

      .skeleton-card {
        background: white;
        height: 100px; /* Altura aproximada do seu card real */
        padding: 20px;
        margin-bottom: 10px;
        border-radius: 13px;
        border-left: 6px solid #e0e0e0; /* Borda cinza inicial */
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
      }

      /* Simula as bordas coloridas alternadas mesmo no loading */
      .skeleton-card:nth-child(odd) {
        border-left-color: #ffe680;
      }
      .skeleton-card:nth-child(even) {
        border-left-color: #add8e6;
      }

      .skeleton-pulse {
        background: #eee;
        background: linear-gradient(
          90deg,
          #eeeeee 25%,
          #f5f5f5 50%,
          #eeeeee 75%
        );
        background-size: 200% 100%;
        animation: skeleton-load 1.5s infinite;
        border-radius: 4px;
      }

      @keyframes skeleton-load {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .sk-date {
        height: 12px;
        width: 80px;
        margin-bottom: 10px;
      }
      .sk-name {
        height: 18px;
        width: 60%;
        margin-bottom: 8px;
      }
      .sk-title {
        height: 14px;
        width: 40%;
      }
    </style>
  </head>
  <body>
    <header class="dash">
      <div class="header-dash" id="dash_title">
        <ea-text color="#fff" shadow="var( --sv-sodalita )" size="1.8rem"
          >Orçamentos</ea-text
        >
      </div>
      <div class="search-container" style="margin-bottom: 1.5rem">
        <input
          type="text"
          id="searchInput"
          placeholder="🔍 Buscar cliente ou serviço..."
          style="
            height: 50px;
            border-radius: 12px;
            border: 1px solid #ddd;
            padding: 0 15px;
            width: 100%;
          "
        />
      </div>
    </header>
    <div id="loading_overlay" class="active">
      <main class="page" style="padding: 0">
        <div class="skeleton-card">
          <div class="skeleton-pulse sk-date"></div>
          <div class="skeleton-pulse sk-name"></div>
          <div class="skeleton-pulse sk-title"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-pulse sk-date"></div>
          <div class="skeleton-pulse sk-name"></div>
          <div class="skeleton-pulse sk-title"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-pulse sk-date"></div>
          <div class="skeleton-pulse sk-name"></div>
          <div class="skeleton-pulse sk-title"></div>
        </div>
        <div class="skeleton-card" style="opacity: 0.7">
          <div class="skeleton-pulse sk-date"></div>
          <div class="skeleton-pulse sk-name"></div>
          <div class="skeleton-pulse sk-title"></div>
        </div>
        <div class="skeleton-card" style="opacity: 0.4">
          <div class="skeleton-pulse sk-date"></div>
          <div class="skeleton-pulse sk-name"></div>
          <div class="skeleton-pulse sk-title"></div>
        </div>
      </main>
    </div>
    <main class="page">
      <ui>
        <div id="list_container">
          <div class="loading">Carregando dados...</div>
        </div>
      </ui>
    </main>

    <script>
      const API_URL = env.endpoints.budgets;
      const CACHE_KEY = "ea_orcamentos_cache";
      const PENDING_KEY = "ea_pending_budget";
      let allOrcamentos = [];

      function renderList(orcamentos) {
        const container = document.getElementById("list_container");
        container.innerHTML = orcamentos.length
          ? ""
          : "<p>Nenhum resultado encontrado.</p>";

        [...orcamentos].reverse().forEach((orc) => {
          const isTemp = String(orc.id).startsWith("TEMP_");
          const dataEmissao = getCleanDate(orc.docTitle.emissao);
          const card = document.createElement("div");
          card.className = "orcamento-card";
          if (isTemp) card.style.opacity = "0.5";

          // Link para visualização (pode ser orcamento.html ou budget.html conforme sua preferência)
          const viewPage = "orcamento.html";

          card.innerHTML = `
            <div class="info" onclick="window.location.href='${viewPage}?id=${orc.id}'" style="cursor:pointer; flex:1;">
                <small style="color:#999">${dataEmissao} ${isTemp ? '<span class="status-label">(Enviando...)</span>' : ""}</small>
                <h3>${orc.cliente.name || "Sem Nome"}</h3>
                <p>${orc.docTitle.text || "Sem Título"}</p>
            </div>
            <div class="options-container">
                ${
                  isTemp
                    ? "<span>⏳</span>"
                    : `
                    <button class="btn-options" onclick="toggleOptionsMenu(event, '${orc.id}')">⋮</button>
                    <div class="options-menu" id="menu-${orc.id}">
                        <button class="menu-item" onclick="editOrcamento('${orc.id}')">
                            <span>✏️</span> Editar
                        </button>
                        <button class="menu-item" onclick="duplicateOrcamento('${orc.id}')">
                            <span>📋</span> Duplicar
                        </button>
                        <button class="menu-item delete" onclick="deleteOrcamento('${orc.id}')">
                            <span>🗑️</span> Excluir
                        </button>
                    </div>
                `
                }
            </div>
        `;
          container.appendChild(card);
        });
      }
      // Função para abrir/fechar o menu de um card específico
      function toggleOptionsMenu(event, id) {
        event.stopPropagation(); // Impede que o clique dispare o link do card

        const menu = document.getElementById(`menu-${id}`);
        const isActive = menu.classList.contains("active");

        // Fecha todos os outros menus que possam estar abertos
        document
          .querySelectorAll(".options-menu")
          .forEach((m) => m.classList.remove("active"));

        // Se não estava ativo, abre este
        if (!isActive) {
          menu.classList.add("active");
        }
      }

      // Fecha o menu automaticamente se clicar em qualquer lugar fora dele
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".options-container")) {
          document
            .querySelectorAll(".options-menu")
            .forEach((m) => m.classList.remove("active"));
        }
      });

      // Funções de Apoio no Dashboard
      async function deleteOrcamento(id) {
        id = String(id).trim();

        // Localiza o orçamento para mostrar o nome do cliente no modal (opcional, mas profissional)
        const orcamento = allOrcamentos.find((o) => o.id == id);
        const clienteNome = orcamento
          ? orcamento.cliente.name
          : "este orçamento";

        // 1. USO DO MODAL PROFISSIONAL PARA CONFIRMAÇÃO
        const confirmou = await EAModal.confirm(
          "Excluir Orçamento",
          `Tem certeza que deseja apagar permanentemente o orçamento de <strong>${clienteNome}</strong>?`,
          "danger",
        );

        if (!confirmou) return;

        // 2. Remove da UI e do Cache local imediatamente (Lógica Otimista)
        allOrcamentos = allOrcamentos.filter((orc) => orc.id != id);
        renderList(allOrcamentos);
        localStorage.setItem(CACHE_KEY, JSON.stringify(allOrcamentos));

        try {
          // 3. Exclui no Google Sheets (real)
          // Note que mudamos para POST se o seu script GS atualizado exigir POST para delete
          await fetch(`${API_URL}`, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({ action: "delete", id: id }),
          });

          console.log("Orçamento excluído no Google Sheets.");

          // Feedback suave (opcional)
          // EAModal.alert("Sucesso", "O orçamento foi removido do servidor.");
        } catch (err) {
          // 4. USO DO MODAL PARA ERRO
          EAModal.alert(
            "Erro no Servidor",
            "Não foi possível excluir no servidor. Por favor, sincronize novamente mais tarde.",
          );
          console.error(err);
        }
      }

      function editOrcamento(id) {
        const orc = allOrcamentos.find((x) => x.id == id);
        localStorage.setItem("edit_budget_data", JSON.stringify(orc));
        window.location.href = "captura.html?edit=true";
      }

      async function duplicateOrcamento(id) {
        const orc = allOrcamentos.find((x) => x.id == id);

        const duplicated = {
          ...orc,
          action: "create",
          id: "EA-" + Date.now(),
        };

        document.getElementById("loading_overlay").style.display = "flex";
        try {
          await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify(duplicated),
          });
          loadData(true);
        } catch (e) {
          alert("Erro ao duplicar");
        }
      }

      // Mostrar o Skeleton
      function showLoading() {
        const overlay = document.getElementById("loading_overlay");
        if (overlay) {
          document.body.classList.add("is-loading"); // Esconde a busca
          overlay.style.display = "block";
          // Pequeno timeout para o navegador processar o display antes da opacidade
          setTimeout(() => (overlay.className = "active"), 10);
        }
      }

      // Função centralizada para remover o loading
      function hideLoading() {
        const overlay = document.getElementById("loading_overlay");
        if (overlay) {
          document.body.classList.remove("is-loading"); // Mostra a busca
          overlay.className = "hidden";
          // Aguarda a animação de 0.4s e esconde o display
          setTimeout(() => {
            if (overlay.className === "hidden") overlay.style.display = "none";
          }, 400);
        }
      }

      // 2. Ajuste no loadData para esconder se houver cache
      async function loadData(forceRefresh = false) {
        const cachedData = localStorage.getItem(CACHE_KEY);

        if (cachedData) {
          allOrcamentos = JSON.parse(cachedData);
          renderList(allOrcamentos);
          hideLoading(); // <-- FECHA O SKELETON SE JÁ TEMOS DADOS SALVOS
        }

        checkAndSyncPending();

        if (forceRefresh || !cachedData) {
          await fetchAndCache();
        }
      }

      async function checkAndSyncPending() {
        const pending = localStorage.getItem(PENDING_KEY);
        if (!pending) return;

        try {
          const payload = JSON.parse(pending);

          await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "text/plain;charset=utf-8",
            },
            body: JSON.stringify(payload),
          });

          // 👉 SÓ AQUI remove definitivamente do cache
          if (payload.action === "delete") {
            const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "[]");
            const updated = cached.filter((orc) => orc.id != payload.id);
            localStorage.setItem(CACHE_KEY, JSON.stringify(updated));
          }

          localStorage.removeItem(PENDING_KEY);

          setTimeout(() => {
            fetchAndCache(true);
            console.log("Sincronização concluída.");
          }, 1500);
        } catch (e) {
          console.error("Falha na sincronização:", e);
        }
      }

      async function fetchAndCache(isSilent = false) {
        if (!isSilent) showLoading(); // <-- ATIVA O SKELETON AO CLICAR EM SINCRONIZAR

        try {
          const response = await fetch(`${API_URL}?t=${new Date().getTime()}`);
          allOrcamentos = await response.json();
          localStorage.setItem(CACHE_KEY, JSON.stringify(allOrcamentos));
          renderList(allOrcamentos);
        } catch (error) {
          console.error("Erro ao buscar dados:", error);
          if (!isSilent) alert("Erro ao atualizar dados da nuvem.");
        } finally {
          hideLoading(); // <-- SEMPRE ESCONDE NO FINAL
        }
      }

      document.getElementById("searchInput").on("input", (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allOrcamentos.filter(
          (orc) =>
            orc.cliente.name.toLowerCase().includes(term) ||
            orc.docTitle.text.toLowerCase().includes(term),
        );
        renderList(filtered);
      });

      function exportarDados() {
        if (allOrcamentos.length === 0) {
          return alert("Não há dados para exportar.");
        }

        // Converte o array de objetos para uma string formatada
        const dataStr = JSON.stringify(allOrcamentos, null, 2);

        // Cria um "Blob" (objeto de dados binários)
        const blob = new Blob([dataStr], { type: "application/json" });

        // Cria um link temporário para o download
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        // Define o nome do arquivo com a data atual
        const dataHoje = new Date().toISOString().split("T")[0];
        link.download = `backup_orcamentos_ea_${dataHoje}.json`;
        link.href = url;

        // Simula o clique para baixar e remove o link
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      window.addEventListener("load", () => {
        /*createThunderText({
          text: "Orçamentos",
          size: "1.8rem",
          color: "#333",
          target: "#dash_title",
        });*/

        /* dash_title.innerHTML = tt({
          tag: "h1",
          text: "Orçamentos",
        }); */

        loadData();

        createFAB([
          { icon: "✍️", label: "Novo Orçamento", action: `captura.html` },
          { icon: "✍️", label: "Deletar Orçamento", action: `captura.html` },
          {
            icon: "💾",
            label: "Exportar Backup",
            action: () => exportarDados(),
          },
          { icon: "🔄", label: "Sincronizar", action: () => loadData(true) },
        ]);
      });
    </script>
  </body>
</html>
