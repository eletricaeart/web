<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Elétrica & Art</title>
    <link rel="stylesheet" href="../assets/globals.css" />
    <script cjs src="../assets/cjs.js"></script>
    <script src="../assets/env.js"></script>
    <style>
      body {
        background: #f0f2f5;
        padding: 20px;
        font-family: "Poppins", sans-serif;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      .header-dash {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }
      .btn-new {
        background: #ffcc00;
        color: #333;
        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
      }

      .orcamento-card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 15px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: 0.3s;
        border-left: 5px solid #ffcc00;
      }
      .orcamento-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      .info h3 {
        margin: 0;
        color: #333;
      }
      .info p {
        margin: 5px 0 0;
        color: #777;
        font-size: 0.9em;
      }

      .actions a {
        background: #333;
        color: white;
        padding: 8px 15px;
        border-radius: 5px;
        text-decoration: none;
        font-size: 0.85em;
      }
      .loading {
        text-align: center;
        padding: 50px;
        color: #777;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header-dash">
        <h1>Meus Orçamentos</h1>
        <a href="captura.html" class="btn-new">+ Novo Orçamento</a>
      </div>

      <div id="list_container">
        <div class="loading">Carregando orçamentos da planilha...</div>
      </div>
    </div>

    <script>
      const API_URL = env.endpoint;

      async function loadOrcamentos() {
        const container = document.getElementById("list_container");

        try {
          const response = await fetch(API_URL);
          const orcamentos = await response.json();

          container.innerHTML = "";

          if (orcamentos.length === 0) {
            container.innerHTML = "<p>Nenhum orçamento encontrado.</p>";
            return;
          }

          // Inverte para mostrar os mais recentes primeiro
          orcamentos.reverse().forEach((orc) => {
            const card = document.createElement("div");
            card.className = "orcamento-card";
            card.innerHTML = `
                    <div class="info">
                        <h3>${orc.cliente.name}</h3>
                        <p>${orc.docTitle.text} - ${orc.docTitle.emissao}</p>
                    </div>
                    <div class="actions">
                        <a href="@.html?id=${orc.id}" target="_blank">Ver PDF</a>
                    </div>
                `;
            container.appendChild(card);
          });
        } catch (error) {
          console.error(error);
          container.innerHTML =
            "<p>Erro ao carregar dados. Verifique a URL da API.</p>";
        }
      }

      loadOrcamentos();
    </script>
  </body>
</html>
