<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Elétrica & Art</title>
    <link rel="stylesheet" href="../assets/globals.css" />
    <script cjs src="../assets/cjs.js"></script>
    <script src="../assets/helpers.js"></script>
    <script src="../assets/env.js"></script>
    <style>
      body {
        background: #f0f2f5;
        /* padding: 20px; */
        font-family: "Poppins", sans-serif;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      .header-dash {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }
      .btn-new {
        background: #ffcc00;
        color: #333;
        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
      }

      .orcamento-card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 15px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: 0.3s;
        border-left: 5px solid #ffcc00;
      }
      .orcamento-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      .info h3 {
        margin: 0;
        color: #333;
      }
      .info p {
        margin: 5px 0 0;
        color: #777;
        font-size: 0.9em;
      }

      .actions a {
        background: #333;
        color: white;
        padding: 8px 15px;
        border-radius: 5px;
        text-decoration: none;
        font-size: 0.85em;
      }
      .loading {
        text-align: center;
        padding: 50px;
        color: #777;
      }
    </style>
  </head>
  <body>
    <div id="loading_overlay" style="display: none">
      <div class="spinner"></div>
      <t>Sincronizando com a nuvem...</t>
    </div>
    <appbar>
      <ui>
        <header></header>
        <options></options>
      </ui>
      <style>
        appbar {
          flex-flow: row;
        }
        appbar > ui {
          display: flex;
          flex-flow: row;
          width: 100%;
          height: 100%;
        }
        appbar > ui > header {
          background-color: #ffab00;
          width: 70%;
          height: 100%;
        }
        appbar > ui > options {
          background: #905;
          height: 100%;
          aspect-ratio: 1;
          display: flex;
        }
      </style>
    </appbar>
    <div class="container">
      <button onclick="loadData(true)" class="btn-refresh">
        🔄 Atualizar Dados
      </button>
      <div class="header-dash">
        <h1>Meus Orçamentos</h1>
        <a href="captura.html" class="btn-new">+ Novo Orçamento</a>
      </div>

      <div id="list_container">
        <div class="loading">Carregando orçamentos da planilha...</div>
      </div>
    </div>

    <script>
      const API_URL = env.endpoint;
      const CACHE_KEY = "ea_orcamentos_cache";

      // 1. Função para renderizar a lista
      function renderList(orcamentos) {
        const container = document.getElementById("list_container");
        container.innerHTML = "";

        if (!orcamentos || orcamentos.length === 0) {
          container.innerHTML = "<p>Nenhum orçamento encontrado.</p>";
          return;
        }

        orcamentos.reverse().forEach((orc) => {
          const dataEmissaoLimpa = getCleanDate(orc.docTitle.emissao);

          const card = document.createElement("div");
          card.className = "orcamento-card";
          card.innerHTML = `
                <div class="info">
                    <h3>${orc.cliente.name || "Sem Nome"}</h3>
                    <p>${orc.docTitle.text || "Sem Título"} - ${dataEmissaoLimpa}</p>
                </div>
                <div class="actions">
                    <a href="@.html?id=${orc.id}" target="_blank">Ver PDF</a>
                </div>
            `;
          container.appendChild(card);
        });
      }

      // 2. Função principal de carga
      async function loadData(forceRefresh = false) {
        const container = document.getElementById("list_container");
        const cachedData = localStorage.getItem(CACHE_KEY);

        // Se houver cache e não for um "refresh" forçado, usa o cache primeiro
        if (cachedData && !forceRefresh) {
          console.log("Carregando do cache...");
          renderList(JSON.parse(cachedData));
          // Opcional: faz um fetch silencioso para atualizar o cache para a próxima vez
          fetchAndCache();
          return;
        }

        // Se for forçado ou não tiver cache, mostra loading
        container.innerHTML =
          "<div class='loading'>Buscando dados atualizados do Google Sheets...</div>";
        await fetchAndCache();
      }

      async function fetchAndCache() {
        const overlay = document.getElementById("loading_overlay");
        overlay.style.display = "flex"; // Mostra o loading_overlay

        try {
          const response = await fetch(API_URL);
          const data = await response.json();

          // Salva no localStorage
          localStorage.setItem(CACHE_KEY, JSON.stringify(data));

          // Renderiza
          renderList(data);
        } catch (error) {
          console.error("Erro ao buscar dados:", error);
          if (!localStorage.getItem(CACHE_KEY)) {
            document.getElementById("list_container").innerHTML =
              "<p>Erro ao carregar e sem cache disponível.</p>";
          }
        } finally {
          // Esconde o loading sempre, mesmo se der erro
          overlay.style.display = "none";
        }
      }

      // Inicialização
      window.addEventListener("load", () => loadData());

      // 3. Adicione um botão de atualizar no seu HTML do Dashboard:
      /* Exemplo de HTML para o botão:
       <button onclick="loadData(true)" class="btn-refresh">🔄 Atualizar Dados</button>
    */
    </script>
  </body>
</html>
