<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notas | Elétrica & Art</title>
    <link rel="stylesheet" href="../assets/css/globals.css" />
    <script cjs src="../assets/js/cjs.js"></script>
    <script src="../assets/js/helpers.js"></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/components/widgets.js" defer></script>
    <script src="../assets/components/BackButton.js" defer></script>
    <script src="../assets/components/ea/Text.js" defer></script>
    <script src="../assets/components/ea/PageHeader.js" defer></script>
    <script src="../assets/components/ea/EANotionEditor.js" defer></script>
    <script src="../assets/components/AppBar.js" defer></script>
    <script src="../assets/components/FAB2.js" defer></script>
    <style>
      body {
        background: #f0f2f5;
        font-family: "Poppins", sans-serif;
      }
      main.page {
        padding-bottom: 8rem !important;
      }
      .header-area {
        padding: 1rem;
        position: sticky;
        top: 72px;
        z-index: 10;
        background: #f0f2f5;
      }
      .note-card {
        background: white;
        padding: 20px;
        margin-bottom: 12px;
        border-radius: 13px;
        border-left: 6px solid #27f;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        cursor: pointer;
        transition: 0.2s;
      }
      .note-card:active {
        transform: scale(0.98);
      }
      .note-preview {
        display: block;
        /* -webkit-line-clamp: 3; */
        /* -webkit-box-orient: vertical; */
        white-space: nowrap; /* Impede a quebra de linha */
        overflow: hidden; /* Esconde o excesso */
        text-overflow: ellipsis; /* Adiciona o "..." */
        color: #666;
        margin: 5px 0;
        font-size: 0.9rem;
      }
      /* Ajuste para que o HTML processado dentro do preview não quebre o layout */
      .note-preview * {
        display: inline; /* Força títulos, divs e lis a ficarem na mesma linha no preview */
        margin: 0;
        padding: 0;
        border: none;
        background: transparent;
      }
    </style>
    <style loading>
      /* Skeleton para Notas */
      #loading_overlay {
        position: fixed;
        top: 150px; /* Ajuste para começar logo abaixo do título "Anotações" */
        left: 0;
        width: 100%;
        height: calc(100vh - 150px);
        background: #f0f2f5;
        z-index: 8000;
        padding: 1rem;
        overflow: hidden;
        transition: opacity 0.4s ease;
        display: none;
      }

      #loading_overlay.active {
        display: block;
        opacity: 1;
      }
      #loading_overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .skeleton-card {
        background: white;
        height: 110px;
        padding: 20px;
        margin-bottom: 12px;
        border-radius: 13px;
        border-left: 6px solid #27f; /* Mantém o padrão azul das notas */
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .skeleton-pulse {
        background: #eee;
        background: linear-gradient(
          90deg,
          #eeeeee 25%,
          #f5f5f5 50%,
          #eeeeee 75%
        );
        background-size: 200% 100%;
        animation: skeleton-load 1.5s infinite;
        border-radius: 4px;
      }

      @keyframes skeleton-load {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .sk-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 15px;
      }
      .sk-title {
        height: 16px;
        width: 50%;
      }
      .sk-date {
        height: 12px;
        width: 60px;
      }
      .sk-body {
        height: 14px;
        width: 90%;
      }
    </style>
  </head>
  <body>
    <page-header center>Anotações</page-header>

    <div id="loading_overlay" class="active">
      <div class="skeleton-card">
        <div class="sk-header">
          <div class="skeleton-pulse sk-title"></div>
          <div class="skeleton-pulse sk-date"></div>
        </div>
        <div class="skeleton-pulse sk-body"></div>
      </div>
      <div class="skeleton-card">
        <div class="sk-header">
          <div class="skeleton-pulse sk-title"></div>
          <div class="skeleton-pulse sk-date"></div>
        </div>
        <div class="skeleton-pulse sk-body"></div>
      </div>
      <div class="skeleton-card" style="opacity: 0.7">
        <div class="sk-header">
          <div class="skeleton-pulse sk-title"></div>
          <div class="skeleton-pulse sk-date"></div>
        </div>
        <div class="skeleton-pulse sk-body"></div>
      </div>
      <div class="skeleton-card" style="opacity: 0.4">
        <div class="sk-header">
          <div class="skeleton-pulse sk-title"></div>
          <div class="skeleton-pulse sk-date"></div>
        </div>
        <div class="skeleton-pulse sk-body"></div>
      </div>
    </div>

    <main class="page" style="padding: 1rem">
      <div id="notes_list"></div>
    </main>

    <script>
      const API_URL = env.endpoints.notes;
      const CACHE_KEY = "ea_notes_cache";
      let allNotes = [];

      // Funções de controle do Loading
      function showLoading() {
        const overlay = document.getElementById("loading_overlay");
        if (overlay) {
          overlay.style.display = "block";
          setTimeout(() => (overlay.className = "active"), 10);
        }
      }

      function hideLoading() {
        const overlay = document.getElementById("loading_overlay");
        if (overlay) {
          overlay.className = "hidden";
          setTimeout(() => {
            if (overlay.className === "hidden") overlay.style.display = "none";
          }, 400);
        }
      }

      async function loadNotes(force = false) {
        const cached = localStorage.getItem(CACHE_KEY);

        if (cached) {
          allNotes = JSON.parse(cached);
          renderNotes(allNotes);
          hideLoading(); // Esconde se já tem cache
        } else {
          showLoading(); // Mostra se for a primeira vez
        }

        if (force) showLoading(); // Sempre mostra ao sincronizar manualmente

        try {
          const res = await fetch(`${API_URL}?t=${new Date().getTime()}`);
          allNotes = await res.json();
          localStorage.setItem(CACHE_KEY, JSON.stringify(allNotes));
          renderNotes(allNotes);
        } catch (e) {
          console.error(e);
        } finally {
          hideLoading();
        }
      }

      function renderNotes(notes) {
        const list = document.getElementById("notes_list");
        list.innerHTML = notes.length ? "" : "<p>Nenhuma anotação.</p>";

        [...notes].reverse().forEach((n) => {
          const div = document.createElement("div");
          div.className = "note-card";
          div.onclick = () =>
            (window.location.href = `view-note.html?id=${n.id}`);

          // 1. Pegamos apenas a primeira linha de texto real
          const primeiraLinhaBruta = n.content.split("\n")[0];

          // 2. Processamos para limpar os símbolos (> , * , #)
          // usando a função que já remove os caracteres de controle
          const conteudoLimpo = EANotionEditor.processText(primeiraLinhaBruta);

          const displayTitle = n.title
            ? `<strong>${n.title}</strong>`
            : `Nota de ${getCleanDate(n.data)}`;

          div.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
              ${displayTitle}
              <small style="color:#999; font-size: 0.7rem;">${getCleanDate(n.data)}</small>
            </div>
            <div class="note-preview">${conteudoLimpo}</div>
            <div style="text-align: right; font-size: 0.75rem; color: #27f; font-weight: 500;">Ler nota completa</div>
          `;
          list.appendChild(div);
        });
      }

      window.addEventListener("load", () => {
        loadNotes();
        createFAB([
          { icon: "✍️", label: "Nova Nota", action: "new-note.html" },
          { icon: "🔄", label: "Sincronizar", action: () => loadNotes(true) },
        ]);
      });
    </script>
  </body>
</html>
