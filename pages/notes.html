<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notas | Elétrica & Art</title>
    <link rel="stylesheet" href="../assets/css/globals.css" />
    <script cjs src="../assets/js/cjs.js"></script>
    <script src="../assets/js/helpers.js"></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/components/widgets.js" defer></script>
    <script src="../assets/components/BackButton.js" defer></script>
    <script src="../assets/components/ea/Text.js" defer></script>
    <script src="../assets/components/ea/PageHeader.js" defer></script>
    <script src="../assets/components/ea/EANotionEditor.js" defer></script>
    <script src="../assets/components/AppBar.js" defer></script>
    <script src="../assets/components/FAB2.js" defer></script>
    <style>
      body {
        background: #f0f2f5;
        font-family: "Poppins", sans-serif;
      }
      main.page {
        padding-bottom: 8rem !important;
      }
      .header-area {
        padding: 1rem;
        position: sticky;
        top: 72px;
        z-index: 10;
        background: #f0f2f5;
      }
      .note-card {
        background: white;
        padding: 20px;
        margin-bottom: 12px;
        border-radius: 13px;
        border-left: 6px solid #27f;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        cursor: pointer;
        transition: 0.2s;
      }
      .note-card:active {
        transform: scale(0.98);
      }
      .note-preview {
        display: block;
        /* -webkit-line-clamp: 3; */
        /* -webkit-box-orient: vertical; */
        white-space: nowrap; /* Impede a quebra de linha */
        overflow: hidden; /* Esconde o excesso */
        text-overflow: ellipsis; /* Adiciona o "..." */
        color: #666;
        margin: 5px 0;
        font-size: 0.9rem;
      }
      /* Ajuste para que o HTML processado dentro do preview não quebre o layout */
      .note-preview * {
        display: inline; /* Força títulos, divs e lis a ficarem na mesma linha no preview */
        margin: 0;
        padding: 0;
        border: none;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="loading_overlay" style="display: none">
      <div class="spinner"></div>
      <t>Carregando...</t>
    </div>

    <page-header center>Anotações</page-header>

    <main class="page" style="padding: 1rem">
      <div id="notes_list"></div>
    </main>

    <script>
      const API_URL = env.endpoints.notes;
      const CACHE_KEY = "ea_notes_cache";
      let allNotes = [];

      async function loadNotes(force = false) {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached && !force) {
          allNotes = JSON.parse(cached);
          renderNotes(allNotes);
        }
        try {
          const res = await fetch(`${API_URL}?t=${new Date().getTime()}`);
          allNotes = await res.json();
          localStorage.setItem(CACHE_KEY, JSON.stringify(allNotes));
          renderNotes(allNotes);
        } catch (e) {
          console.error(e);
        }
      }

      function renderNotes(notes) {
        const list = document.getElementById("notes_list");
        list.innerHTML = notes.length ? "" : "<p>Nenhuma anotação.</p>";

        [...notes].reverse().forEach((n) => {
          const div = document.createElement("div");
          div.className = "note-card";
          div.onclick = () =>
            (window.location.href = `view-note.html?id=${n.id}`);

          // 1. Pegamos apenas a primeira linha de texto real
          const primeiraLinhaBruta = n.content.split("\n")[0];

          // 2. Processamos para limpar os símbolos (> , * , #)
          // usando a função que já remove os caracteres de controle
          const conteudoLimpo = EANotionEditor.processText(primeiraLinhaBruta);

          const displayTitle = n.title
            ? `<strong>${n.title}</strong>`
            : `Nota de ${getCleanDate(n.data)}`;

          div.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
              ${displayTitle}
              <small style="color:#999; font-size: 0.7rem;">${getCleanDate(n.data)}</small>
            </div>
            <div class="note-preview">${conteudoLimpo}</div>
            <div style="text-align: right; font-size: 0.75rem; color: #27f; font-weight: 500;">Ler nota completa</div>
          `;
          list.appendChild(div);
        });
      }

      window.addEventListener("load", () => {
        loadNotes();
        createFAB([
          { icon: "✍️", label: "Nova Nota", action: "new-note.html" },
          { icon: "🔄", label: "Sincronizar", action: () => loadNotes(true) },
        ]);
      });
    </script>
  </body>
</html>
