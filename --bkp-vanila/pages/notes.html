<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notas | Elétrica & Art</title>
    <link rel="stylesheet" href="../assets/css/globals.css" />
    <script cjs src="../assets/js/cjs.js"></script>
    <script src="../assets/js/helpers.js"></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/js/EASync.js"></script>
    <script src="../assets/imgs/icons.js"></script>
    <script src="../assets/components/widgets.js" defer></script>
    <script src="../assets/components/BackButton.js" defer></script>
    <script src="../assets/components/ea/Text.js" defer></script>
    <script src="../assets/components/ea/PageHeader.js" defer></script>
    <script src="../assets/components/ea/EANotionEditor.js" defer></script>
    <script src="../assets/components/AppBar.js" defer></script>
    <script src="../assets/components/BottomNavBar.js" defer></script>
    <script src="../assets/components/FAB.js" defer></script>
    <script src="../assets/components/ea/EAButton.js" defer></script>
    <style>
      body {
        background: #f0f2f5;
        font-family: "Poppins", sans-serif;
      }
      main.page {
        padding-bottom: 8rem !important;
        padding-bottom: 0 !important;
      }
      .header-area {
        padding: 1rem;
        position: sticky;
        top: 72px;
        z-index: 10;
        background: #f0f2f5;
      }
      .note-card {
        background: white;
        padding: 20px;
        margin-bottom: 12px;
        border-radius: 13px;
        /* border-left: 6px solid #27f; */
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        cursor: pointer;
        transition: 0.2s;
      }
      .note-card:active {
        transform: scale(0.98);
      }
      .note-preview {
        display: block;
        /* -webkit-line-clamp: 3; */
        /* -webkit-box-orient: vertical; */
        white-space: nowrap; /* Impede a quebra de linha */
        overflow: hidden; /* Esconde o excesso */
        text-overflow: ellipsis; /* Adiciona o "..." */
        color: #666;
        margin: 5px 0;
        font-size: 0.9rem;
      }
      /* Ajuste para que o HTML processado dentro do preview não quebre o layout */
      .note-preview * {
        display: inline; /* Força títulos, divs e lis a ficarem na mesma linha no preview */
        margin: 0;
        padding: 0;
        border: none;
        background: transparent;
      }
    </style>
    <style loading>
      /* Skeleton para Notas */
      #loading_overlay {
        position: fixed;
        /* top: 150px; /* Ajuste para começar logo abaixo do título "Anotações" */
        top: 72px;
        left: 0;
        width: 100%;
        /* height: calc(100vh - 150px); */
        height: calc(100vh - 72px);
        background: #f0f2f5;
        z-index: 8000;
        padding: 1rem;
        overflow: hidden;
        transition: opacity 0.4s ease;
        display: none;
      }

      #loading_overlay.active {
        display: block;
        opacity: 1;
      }
      #loading_overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .skeleton-card {
        background: white;
        height: 110px;
        padding: 20px;
        margin-bottom: 12px;
        border-radius: 13px;
        border-left: 6px solid #27f; /* Mantém o padrão azul das notas */
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .skeleton-pulse {
        background: #eee;
        background: linear-gradient(
          90deg,
          #eeeeee 25%,
          #f5f5f5 50%,
          #eeeeee 75%
        );
        background-size: 200% 100%;
        animation: skeleton-load 1.5s infinite;
        border-radius: 4px;
      }

      @keyframes skeleton-load {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .sk-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 15px;
      }
      .sk-title {
        height: 16px;
        width: 50%;
      }
      .sk-date {
        height: 12px;
        width: 60px;
      }
      .sk-body {
        height: 14px;
        width: 90%;
      }
    </style>
    <style barra-de-ferramentas>
      /* Barra de Ferramentas */
      .toolbar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 10px 1rem;
        background: #f0f2f5;
        /* position: sticky; */
        top: 72px;
        z-index: 9;
      }

      /* Container de Notas Dinâmico */
      #notes_list {
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 0 1rem 150px;
        transition: all 0.3s ease;
      }

      /* Quando a classe grid-mode NÃO estiver presente (Modo Lista) */
      #notes_list:not(.grid-mode) {
        grid-template-columns: 1fr;
      }

      /* Modo Grade (Ativado por classe no container) */
      #notes_list.grid-mode {
        display: grid;
        grid-template-columns: 45% 45%; /* Dois cards por linha */
        padding: 0 0 150px 0;
        gap: 10px;
        justify-content: center;
      }

      #notes_list.grid-mode .note-card {
        margin-bottom: 0;
        height: 160px; /* Formato mais quadrado */
        display: flex;
        flex-direction: column;

        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }

      #notes_list.grid-mode .note-preview {
        white-space: normal; /* Permite quebra de linha na grade */
        display: -webkit-box;
        -webkit-line-clamp: 4; /* Mostra mais conteúdo */
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- <page-header center>Anotações</page-header> -->

    <div id="loading_overlay" class="active">
      <div class="skeleton-card">
        <div class="sk-header">
          <div class="skeleton-pulse sk-title"></div>
          <div class="skeleton-pulse sk-date"></div>
        </div>
        <div class="skeleton-pulse sk-body"></div>
      </div>
      <div class="skeleton-card">
        <div class="sk-header">
          <div class="skeleton-pulse sk-title"></div>
          <div class="skeleton-pulse sk-date"></div>
        </div>
        <div class="skeleton-pulse sk-body"></div>
      </div>
      <div class="skeleton-card" style="opacity: 0.7">
        <div class="sk-header">
          <div class="skeleton-pulse sk-title"></div>
          <div class="skeleton-pulse sk-date"></div>
        </div>
        <div class="skeleton-pulse sk-body"></div>
      </div>
      <div class="skeleton-card" style="opacity: 0.4">
        <div class="sk-header">
          <div class="skeleton-pulse sk-title"></div>
          <div class="skeleton-pulse sk-date"></div>
        </div>
        <div class="skeleton-pulse sk-body"></div>
      </div>
    </div>

    <toolbar class="toolbar">
      <ea-icon-button
        plain
        id="view_toggle"
        icon1="🔲"
        text1=""
        icon2="${EAIcons.list}"
        text2=""
      >
      </ea-icon-button>
    </toolbar>

    <main class="page">
      <div id="notes_list"></div>
    </main>

    <ea-navbar></ea-navbar>
    <script>
      window.ea_config = {
        title: "Notas",
      };

      const CACHE_KEY = "ea_notes_cache";
      // 1. Carrega o cache imediato (Velocidade total)
      let allNotes = JSON.parse(localStorage.getItem(CACHE_KEY) || "[]");

      const VIEW_PREF_KEY = "ea_notes_view_mode";

      // --- RENDEREZAÇÃO ---
      function renderNotes(notes) {
        const list = document.getElementById("notes_list");
        list.innerHTML = notes.length
          ? ""
          : "<p style='text-align:center; padding:2rem; color:#999;'>Nenhuma anotação encontrada.</p>";

        [...notes].reverse().forEach((n) => {
          const div = document.createElement("div");
          div.className = "note-card";
          // Redireciona para a página de visualização/edição
          div.onclick = () =>
            (window.location.href = `new-note.html?id=${n.id}`);

          // Processa a primeira linha para o preview
          const primeiraLinhaBruta = n.content ? n.content.split("\n")[0] : "";
          const conteudoLimpo =
            typeof EANotionEditor !== "undefined"
              ? EANotionEditor.processText(primeiraLinhaBruta)
              : primeiraLinhaBruta;

          const displayTitle = n.title
            ? `<strong>${n.title}</strong>`
            : `Nota de ${getCleanDate(n.data)}`;

          div.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
          ${displayTitle}
          <small style="color:#999; font-size: 0.7rem;">${getCleanDate(n.data)}</small>
        </div>
        <div class="note-preview">${conteudoLimpo}</div>
        ${n.clienteNome ? `<div style="font-size: 0.7rem; color: #27f; margin-top: 5px;">👤 ${n.clienteNome}</div>` : ""}
      `;
          list.appendChild(div);
        });
      }

      // --- CONTROLE DE UI ---
      function showLoading() {
        const overlay = document.getElementById("loading_overlay");
        if (overlay) {
          overlay.style.display = "block";
          setTimeout(() => (overlay.className = "active"), 10);
        }
      }

      function hideLoading() {
        const overlay = document.getElementById("loading_overlay");
        if (overlay) {
          overlay.className = "hidden";
          setTimeout(() => {
            if (overlay.className === "hidden") overlay.style.display = "none";
          }, 400);
        }
      }

      // --- INICIALIZAÇÃO ---
      window.addEventListener("load", () => {
        const btn = document.getElementById("view_toggle");

        // Usamos os ícones da nossa biblioteca
        btn.setAttribute("icon1", EAIcons.grid);
        btn.setAttribute("icon2", EAIcons.list);

        // Forçamos o render inicial para aplicar os ícones
        btn.render();

        // 1. Aplica a preferência salva
        // const savedView = localStorage.getItem(VIEW_PREF_KEY);
        // assumes grid mode by default
        const VIEW_PREF_KEY = "ea_notes_view_mode";
        const savedView = localStorage.getItem(VIEW_PREF_KEY) || "grid"; // Padrão agora é GRID

        if (savedView === "grid") {
          document.getElementById("notes_list").classList.add("grid-mode");
          const toggleBtn = document.getElementById("view_toggle");
          if (toggleBtn) {
            toggleBtn._active = true; // Garante que o botão visualmente mostre o estado correto
          }
        }
        // --- end grid mode by default --
        // if (savedView === "grid") {
        //   document.getElementById("notes_list").classList.add("grid-mode");
        //   document.getElementById("view_toggle")._active = true;
        //   document.getElementById("view_toggle").render();
        // }

        // 2. Configura o clique do botão
        document
          .getElementById("view_toggle")
          .addEventListener("click", function () {
            const isGrid = this.toggle();
            const container = document.getElementById("notes_list");

            if (isGrid) {
              container.classList.add("grid-mode");
              localStorage.setItem(VIEW_PREF_KEY, "grid");
            } else {
              container.classList.remove("grid-mode");
              localStorage.setItem(VIEW_PREF_KEY, "list");
            }
          });

        if (allNotes.length > 0) {
          renderNotes(allNotes);
          hideLoading();
        } else {
          showLoading();
        }

        createFAB([
          {
            icon: "✍️",
            label: "Nova Nota",
            action: () => (window.location.href = "new-note.html"),
          },
          {
            icon: "🔄",
            label: "Sincronizar",
            action: () => {
              showLoading();
              EASync.pull("notes");
            },
          },
        ]);
      });

      // ESCUTA O MOTOR EASync
      window.addEventListener("sync_ready_notes", (e) => {
        allNotes = e.detail;
        renderNotes(allNotes);
        hideLoading();
      });
    </script>
  </body>
</html>
