<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Cliente | Elétrica & Art</title>
    <link rel="stylesheet" href="../assets/css/globals.css" />
    <script cjs src="../assets/js/cjs.js"></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/js/helpers.js"></script>
    <script src="../assets/components/BackButton.js" defer></script>
    <script src="../assets/components/ea/Text.js" defer></script>
    <script src="../assets/components/ea/PageHeader.js" defer></script>
    <script src="../assets/components/AppBar.js" defer></script>
    <script src="../assets/components/BottomNavBar.js" defer></script>
    <script src="../assets/components/ea/EAModal.js" defer></script>
    <style>
      body {
        background: #f0f2f5;
        font-family: "Poppins", sans-serif;
      }
      .avatar-section {
        text-align: center;
        padding: 2rem;
        background: var(--sv-sodalita);
        color: white;
      }
      .avatar-circle {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 4px solid white;
        margin: 0 auto 10px;
        overflow: hidden;
        background: #eee;
        cursor: pointer;
        position: relative;
      }
      .avatar-circle img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .avatar-overlay {
        position: absolute;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        width: 100%;
        font-size: 10px;
        padding: 2px 0;
      }

      .form-container {
        margin: -30px 0 100px;
        padding: 0 0 150px;
      }
      .form-container > content {
        max-width: 850px;
        width: 100%;
        margin: 0 auto;
        padding: 0 1rem;
        gap: 0;
      }
      card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        margin-bottom: 1.5rem;
        overflow: hidden;
        display: block;
      }
      .card-header {
        background: #f8f9fa;
        padding: 10px 20px;
        border-bottom: 1px solid #eee;
        font-weight: bold;
        color: var(--sv-sombra-azul);
      }
      .card-body {
        padding: 20px;
      }

      .input-group {
        margin-bottom: 15px;
      }
      .input-group label {
        display: block;
        font-size: 0.8rem;
        color: #777;
        margin-bottom: 5px;
        font-weight: 600;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-family: inherit;
        font-size: 0.95rem;
      }

      footer.footer-btn {
        display: grid;
        place-items: center;
        padding: 1rem;
        gap: 1rem;
        position: fixed;
        bottom: 0;
        width: 100%;
        background: #f5f5f5;
      }
      .btn-save {
        background: #e8f1ff;
        background: #27f3;
        color: var(--card-lv2);
        width: 100%;
        height: 56px;
        font-weight: bold;
        font-size: 1.1rem;
        font-family: inherit;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        /*position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);*/
        max-width: 820px;
        z-index: 100;
        /* box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); */
        /* box-shadow: 0 0 0 5px #27f3; */
      }
      .gender-select {
        display: flex;
        gap: 10px;
      }
      .gender-btn {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
        text-align: center;
        cursor: pointer;
      }
      .gender-btn.active {
        background: var(--sv-sombra-azul);
        color: white;
        border-color: var(--sv-sombra-azul);
      }
    </style>
    <style divider>
      divider {
        position: relative;
      }
      divider::before {
        border-bottom: 2px dashed #9995;
        content: " ";
        width: 90%;
        left: 5%;
        position: absolute;
      }
    </style>
  </head>
  <body>
    <div class="avatar-section">
      <div
        class="avatar-circle"
        onclick="document.getElementById('fileInput').click()"
      >
        <img
          id="view_avatar"
          src="../assets/imgs/avatar/default_avatar_masc.webp"
          alt="Avatar"
        />
        <div class="avatar-overlay">ALTERAR FOTO</div>
      </div>
      <input
        type="file"
        id="fileInput"
        style="display: none"
        accept="image/*"
      />
      <h2 id="view_name">Novo Cliente</h2>
    </div>

    <div class="form-container" id="client_content">
      <input type="hidden" id="c_id" />

      <content>
        <card>
          <div class="card-header">DADOS BÁSICOS</div>
          <div class="card-body">
            <div id="view_mode_basics">
              <p>
                <small>NOME/EMPRESA:</small><br /><strong id="label_name"
                  >---</strong
                >
              </p>
              <p>
                <small>CPF/CNPJ:</small><br /><strong id="label_doc"
                  >---</strong
                >
              </p>
            </div>
            <div id="edit_mode_basics" style="display: none">
              <div class="input-group">
                <label>NOME COMPLETO / EMPRESA *</label>
                <input
                  type="text"
                  id="c_name"
                  placeholder="Ex: Silvio Junior"
                />
              </div>
              <div
                class="grid-row"
                style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px"
              >
                <div class="input-group">
                  <label>GÊNERO</label>
                  <select id="c_gender" onchange="updateDefaultAvatar()">
                    <option value="masc">Masculino</option>
                    <option value="fem">Feminino</option>
                  </select>
                </div>
                <div class="input-group">
                  <label>CPF / CNPJ</label>
                  <input type="text" id="c_doc" placeholder="000.000.000-00" />
                </div>
              </div>
            </div>
          </div>
        </card>

        <card>
          <div class="card-header">CONTATO</div>
          <div class="card-body">
            <div id="view_mode_contact">
              <p>
                <small>WHATSAPP:</small><br /><strong id="label_whatsapp"
                  >---</strong
                >
              </p>
              <p>
                <small>EMAIL:</small><br /><strong id="label_email">---</strong>
              </p>
            </div>
            <div id="edit_mode_contact" style="display: none">
              <div
                class="grid-row"
                style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px"
              >
                <div class="input-group">
                  <label>WHATSAPP</label>
                  <input
                    type="tel"
                    id="c_whatsapp"
                    placeholder="(13) 99999-9999"
                  />
                </div>
                <div class="input-group">
                  <label>EMAIL</label>
                  <input
                    type="email"
                    id="c_email"
                    placeholder="cliente@email.com"
                  />
                </div>
              </div>
            </div>
          </div>
        </card>

        <card>
          <div class="card-header">ENDEREÇO</div>
          <div class="card-body">
            <div id="view_mode_address">
              <p>
                <small>ENDEREÇO:</small><br /><strong id="label_address"
                  >---</strong
                >
              </p>
              <p>
                <small>BAIRRO/CIDADE:</small><br /><strong id="label_city"
                  >---</strong
                >
              </p>
            </div>
            <div id="edit_mode_address" style="display: none">
              <div class="input-group">
                <label>CEP</label>
                <input type="text" id="c_cep" maxlength="9" />
              </div>
              <div class="input-group">
                <label>RUA / LOGRADOURO</label>
                <input type="text" id="c_rua" />
              </div>
              <div
                class="grid-row"
                style="display: grid; grid-template-columns: 1fr 2fr; gap: 15px"
              >
                <div class="input-group">
                  <label>NÚMERO</label>
                  <input type="text" id="c_num" />
                </div>
                <div class="input-group">
                  <label>BAIRRO</label>
                  <input type="text" id="c_bairro" />
                </div>
              </div>
              <div class="input-group">
                <label>CIDADE - UF</label>
                <input type="text" id="c_cidade" />
              </div>
            </div>
          </div>
        </card>

        <budgets section id="section_history" style="display: none">
          <divider section>
            <content>
              <t6 title>HISTÓRICO DE ORÇAMENTOS</t6>
            </content>
          </divider>

          <content id="history_list"> </content>
        </budgets>

        <notes
          section
          id="section_notes"
          style="display: none; margin-top: 2rem"
        >
          <divider section>
            <content>
              <t6 title>NOTAS TÉCNICAS DA OBRA</t6>
            </content>
          </divider>

          <content id="notes_history_list"> </content>
        </notes>
      </content>

      <footer class="footer-btn" id="footer_edit" style="display: none">
        <button class="btn-save" onclick="saveClient()">
          SALVAR ALTERAÇÕES
        </button>
        <button
          class="btn-save"
          style="background: #ff4444; color: #ffafaf"
          ;
          onclick="toggleEditMode(false)"
        >
          CANCELAR
        </button>
      </footer>
    </div>

    <ea-navbar></ea-navbar>

    <script>
      window.ea_config = {
        // title: "Novo Cliente",
      };

      const AVATARS = {
        masc: "../assets/imgs/avatar/default_avatar_masc.webp",
        fem: "../assets/imgs/avatar/default_avatar_fem.webp",
      };

      let isEditing = false;

      // Fecha o menu se clicar fora
      document.addEventListener("click", () => {
        document.getElementById("local_menu").classList.remove("active");
      });

      /**
       * [ toggleEditMode ]
       */
      function toggleEditMode(editing) {
        const urlParams = new URLSearchParams(window.location.search);
        const hasId = urlParams.get("id");
        const draft = localStorage.getItem("ea_draft_budget");

        // LÓGICA DE CANCELAMENTO PARA NOVO ORÇAMENTO
        if (!editing && !hasId && draft) {
          // Se eu cliquei em cancelar, não tenho ID (cliente novo) e tenho rascunho:
          // Volto para o orçamento sem salvar nenhum cliente novo.
          window.location.href = "captura.html?restore=true";
          return;
        }

        isEditing = editing;
        const viewIDs = [
          "view_mode_basics",
          "view_mode_contact",
          "view_mode_address",
          "btn_local_options",
        ];
        const editIDs = [
          "edit_mode_basics",
          "edit_mode_contact",
          "edit_mode_address",
          "footer_edit",
        ];

        viewIDs.forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.style.display = editing ? "none" : "block";
        });

        editIDs.forEach((id) => {
          const el = document.getElementById(id);
          if (el) {
            el.style.display = !editing
              ? "none"
              : el.getAttribute("id") == "footer_edit"
                ? "grid"
                : "block";
          }
        });

        if (window.ea_config) {
          const titleEl = document.querySelector("ea-text");
          if (titleEl)
            titleEl.innerText = editing
              ? "Editar Cliente"
              : "Perfil do Cliente";
        }
      }
      // --- end toggleEditMode ---

      function fillForm(c) {
        document.getElementById("c_id").value = c.id;
        document.getElementById("c_name").value = c.name;
        document.getElementById("c_doc").value = c.doc || "";
        document.getElementById("c_whatsapp").value = c.whatsapp || "";
        document.getElementById("c_email").value = c.email || "";
        document.getElementById("c_gender").value = c.gender || "masc";
        document.getElementById("c_cep").value = c.cep || "";
        document.getElementById("c_rua").value = c.rua || "";
        document.getElementById("c_num").value = c.num || "";
        document.getElementById("c_bairro").value = c.bairro || "";
        document.getElementById("c_cidade").value = c.cidade || "";

        document.getElementById("label_name").innerText = c.name;
        document.getElementById("label_doc").innerText =
          c.doc || "Não informado";
        document.getElementById("label_whatsapp").innerText =
          c.whatsapp || "Não informado";
        document.getElementById("label_email").innerText =
          c.email || "Não informado";
        document.getElementById("label_address").innerText =
          `${c.rua || "---"}, ${c.num || "S/N"}`;
        document.getElementById("label_city").innerText =
          `${c.bairro || "---"} - ${c.cidade || "---"}`;

        updateDefaultAvatar();
        document.getElementById("view_name").innerText = c.name;
      }

      window.addEventListener("load", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get("id");

        if (editId) {
          const clients = JSON.parse(
            localStorage.getItem("ea_clients_cache") || "[]",
          );
          const clientObj = clients.find((c) => c.id === editId);

          if (clientObj) {
            fillForm(clientObj);
            toggleEditMode(false);
            loadCustomerHistory(clientObj.name);
            loadCustomerNotes(clientObj.name);

            // configuração do vmenu
            if (window.setAppBarActions) {
              window.setAppBarActions([
                {
                  icon: "✏️",
                  label: "Editar Cliente",
                  action: () => toggleEditMode(true),
                },
                {
                  icon: "📄",
                  label: "Novo Orçamento",
                  action: () => {
                    // Salva o cliente atual como o selecionado para o próximo orçamento
                    localStorage.setItem(
                      "ea_selected_client",
                      JSON.stringify(clientObj),
                    );

                    // Limpa qualquer rascunho antigo de outro cliente para não dar conflito
                    localStorage.removeItem("ea_draft_budget");

                    // Vai para a tela de captura
                    setTimeout(() => {
                      window.location.href = "captura.html?restore=true";
                    }, 100);
                  },
                },
                {
                  icon: "📝",
                  label: "Nova Nota",
                  action: () => {
                    // 1. Salva o nome do cliente para a tela de nova nota
                    localStorage.setItem(
                      "ea_note_target_client",
                      clientObj.name,
                    );

                    // 2. Vai para a tela de criação de nota
                    setTimeout(() => {
                      window.location.href = "new-note.html";
                    }, 100);
                  },
                },
                {
                  icon: "🗑️",
                  label: "Excluir Cliente",
                  action: () => deleteClient(),
                },
              ]);
            }
          }
        } else {
          toggleEditMode(true);
          document.getElementById("view_name").innerText = "Novo Cliente";
          // Para novos clientes, podemos esconder o vmenu ou deixar vazio
          if (window.setAppBarActions) window.setAppBarActions([]);
        }
      });

      function loadCustomerHistory(clientName) {
        const budgetsCache = JSON.parse(
          localStorage.getItem("ea_orcamentos_cache") || "[]",
        );
        const history = budgetsCache.filter(
          (o) => o.cliente.name === clientName,
        );
        const section = document.getElementById("section_history");
        const container = document.getElementById("history_list");

        if (history.length > 0) {
          section.style.display = "block";
          container.innerHTML = history
            .map(
              (o) => `
            <card style="margin-bottom: 10px; cursor: pointer;" onclick="window.location.href='orcamento.html?id=${o.id}'">
              <div style="padding: 15px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <strong>${o.docTitle.text || "Orçamento sem título"}</strong><br>
                  <small>Emissão: ${getCleanDate(o.docTitle.emissao)}</small>
                </div>
                <div style="color: var(--sv-sombra-azul); font-weight: bold;"> > </div>
              </div>
            </card>`,
            )
            .join("");
        }
      }

      function loadCustomerNotes(clientName) {
        const notesCache = JSON.parse(
          localStorage.getItem("ea_notes_cache") || "[]",
        );
        const customerNotes = notesCache.filter(
          (n) => n.clienteNome === clientName,
        );
        const section = document.getElementById("section_notes");
        const container = document.getElementById("notes_history_list");

        if (customerNotes.length > 0) {
          section.style.display = "block";
          container.innerHTML = customerNotes
            .map(
              (n) => `
            <card style="margin-bottom: 10px; border-left: 5px solid var(--sv-sodalita); cursor: pointer;" onclick="window.location.href='new-note.html?id=${n.id}'">
              <div style="padding: 15px;">
                <div style="display: flex; justify-content: space-between;">
                  <strong>${n.title}</strong>
                  <small>${getCleanDate(n.data)}</small>
                </div>
                <p style="margin-top: 5px; font-size: 0.8rem; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                  ${n.content.split("\n")[0]}
                </p>
              </div>
            </card>`,
            )
            .join("");
        }
      }

      async function deleteClient() {
        const id = document.getElementById("c_id").value;
        const name = document.getElementById("c_name").value;
        if (!id) return;

        const budgetsCache = JSON.parse(
          localStorage.getItem("ea_orcamentos_cache") || "[]",
        );
        const totalVinculados = budgetsCache.filter(
          (o) => o.cliente.name === name,
        ).length;

        const confirmou = await EAModal.confirm(
          "Excluir Cliente",
          `O cliente <b>${name}</b> possui <b>${totalVinculados}</b> orçamentos. Deseja excluir permanentemente?`,
          "danger",
        );
        if (!confirmou) return;

        try {
          await fetch(env.endpoints.clients, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({ action: "delete", id: id }),
          });
          let cache = JSON.parse(
            localStorage.getItem("ea_clients_cache") || "[]",
          );
          localStorage.setItem(
            "ea_clients_cache",
            JSON.stringify(cache.filter((c) => c.id !== id)),
          );
          window.location.href = "clientes-lista.html";
        } catch (e) {
          alert("Erro ao excluir.");
        }
      }

      async function saveClient() {
        const name = document.getElementById("c_name").value.trim();
        const editId = document.getElementById("c_id").value;
        if (!name) return alert("Nome obrigatório!");

        const clientData = {
          id: editId || crypto.randomUUID(),
          name: name,
          gender: document.getElementById("c_gender").value,
          doc: document.getElementById("c_doc").value,
          whatsapp: document.getElementById("c_whatsapp").value,
          email: document.getElementById("c_email").value,
          cep: document.getElementById("c_cep").value,
          rua: document.getElementById("c_rua").value,
          num: document.getElementById("c_num").value,
          bairro: document.getElementById("c_bairro").value,
          cidade: document.getElementById("c_cidade").value,
          updatedAt: new Date().toISOString(),
        };

        try {
          await fetch(env.endpoints.clients, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({ action: "save_client", ...clientData }),
          });
          let cache = JSON.parse(
            localStorage.getItem("ea_clients_cache") || "[]",
          );
          const idx = cache.findIndex((c) => c.id === clientData.id);
          if (idx > -1) cache[idx] = clientData;
          else cache.push(clientData);

          localStorage.setItem("ea_clients_cache", JSON.stringify(cache));

          // Verifica se viemos da tela de orçamento através de um rascunho salvo
          const draft = localStorage.getItem("ea_draft_budget");

          if (draft) {
            // 2. Salva o novo cliente como o selecionado para a volta
            localStorage.setItem(
              "ea_selected_client",
              JSON.stringify(clientData),
            );

            // 3. RETORNA PARA CAPTURA: O parâmetro restore=true avisa a captura.html para ler o rascunho
            window.location.href = "captura.html?restore=true";
          } else {
            // Fluxo normal: se não havia orçamento sendo feito, vai para a lista
            window.location.href = "clientes-lista.html";
          }
        } catch (e) {
          alert("Erro ao salvar.");
        }
      }

      function updateDefaultAvatar() {
        const gender = document.getElementById("c_gender").value;
        document.getElementById("view_avatar").src = AVATARS[gender];
      }
    </script>
  </body>
</html>
