    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        margin: 0;
        overflow-x: hidden;
      }
      home-page {
        background-image: linear-gradient(2deg, black, #ccccf2);
        display: flex;
        flex-direction: column;
        flex: 1;
        overflow-y: auto;
        height: auto !important; /* No mobile, deixe o conteúdo fluir */
        background-image: linear-gradient(2deg, black, #ccccf2);
      }
      home-page > view {
        flex: 1;
        background: transparent;
      }
      menu-hb {
        cursor: pointer;
        z-index: 1001;
      }

      /* Estilo do Menu Lateral (Drawer) */
      nav-menu {
        position: fixed;
        top: 0;
        right: -100%; /* Começa escondido */
        width: 250px;
        height: 100%;
        background: #154a8f;
        box-shadow: -5px 0 15px rgba(0, 0, 0, 0.5);
        z-index: 1000;
        transition: 0.3s ease-all;
        display: flex;
        flex-direction: column;
        padding-top: 80px;
      }

      nav-menu.active {
        right: 0;
      }

      nav-menu a {
        color: white;
        text-decoration: none;
        padding: 15px 25px;
        font-size: 1.1em;
        border-bottom: 1px solid #ffffff20;
        font-family: "Poppins", sans-serif;
      }

      nav-menu a:hover {
        background: #ba2e11;
      }

      /* Overlay para fechar o menu ao clicar fora */
      menu-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        z-index: 999;
      }
      menu-overlay.active {
        display: block;
      }
    </style>

    <home-page>
      <view>
        <style>
          body {

            color: #fff;

            align-items: center;
            justify-content: center;
          }

          header-page {

            flex-direction: column;
            background-image: url("./assets/eaLogos/lampada.jpg");

            background-repeat: no-repeat;
            background-position: 0 0;
            background-blend-mode: multiply;
            background-color: #000a;
          }
          @media screen and (max-width: 650px) {
            header-page {
              background-image: url("./assets/eaLogos/a6.jpg");
            }
          }
          slogan {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2em;
          }
          :where(slogan > h1) {
            color: #f5f5f5;
            display: flex;
            width: 90%;
          }
          destaque {
            color: #daa520;
          }

            display: flex;
            width: 100%;
            color: #d5d5d5;
          }

          header-pic {
            display: flex;
            flex-direction: column;
          }

          header-pic > buttons {
            display: flex;
            flex-direction: column;
            padding: 2em;
            gap: 1em;
          }
          header-pic > buttons > input[type="button"] {
            width: 60%;
            margin: 0 auto;
            border-radius: 0;
            font-size: 10px;
            background: #0000;
            color: #f5f5f5;
          }
          input[type="button"][main] {
            background: #ba2e11;
          }
        </style>

        <header-page>

            </p>
          </slogan>
          <header-pic>
            <buttons>
              <input type="button" value="reserve um horário ➝" main />
              <input type="button" value="nossos serviços ➝" />
            </buttons>
            <img src="./assets/imgs/ea/EA-Rafael.png" alt="" />
          </header-pic>
